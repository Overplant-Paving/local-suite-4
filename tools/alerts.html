<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Severe Weather Alert Board · Local Suite</title>
<link rel="stylesheet" href="../core/suite.css" data-suite-inline>
<style>
  /* tool accents: the severity color scale (3-layer, same pattern as core)
     Phase 4 a11y: light --moderate/--minor/--unknown deepened so white badge text
     meets AA (were 2.91/2.42/3.87); in dark the severity colors must stay light
     (they double as text on the card), so the badge/count ink flips dark instead
     via --sev-ink (white text was 1.85–3.23 on the dark severity colors). */
  :root {
    --extreme: #b5179e; --severe: #d1341f; --moderate: #a35f08;
    --minor: #85690a; --unknown: #626a78; --clear: #3a7d44; --sev-ink: #fff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --extreme: #e05bc8; --severe: #ec6a55; --moderate: #e2a24f;
      --minor: #d9bd52; --unknown: #8b93a1; --clear: #7dc487; --sev-ink: #15171b;
    }
  }
  :root[data-theme="light"] {
    --extreme: #b5179e; --severe: #d1341f; --moderate: #a35f08;
    --minor: #85690a; --unknown: #626a78; --clear: #3a7d44; --sev-ink: #fff;
  }
  :root[data-theme="dark"] {
    --extreme: #e05bc8; --severe: #ec6a55; --moderate: #e2a24f;
    --minor: #d9bd52; --unknown: #8b93a1; --clear: #7dc487; --sev-ink: #15171b;
  }
  body { padding: 1.4rem 1.25rem 4rem; }
  .wrap { max-width: 900px; margin: 0 auto; }
  .topbar { display: flex; align-items: center; gap: 1rem; margin-bottom: 1rem; }
  /* v1: back link is muted (hover -> accent, no underline); core default is accent */
  .back { color: var(--muted); white-space: nowrap; }
  .back:hover { color: var(--accent); text-decoration: none; }
  /* v1: button sits in the flex topbar, no float */
  .topbar .theme-btn { margin-left: auto; float: none; }
  header h1 { font-size: 1.6rem; letter-spacing: -.02em; }
  .locbar {
    display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
    margin: .5rem 0 1.3rem; color: var(--muted); font-size: .9rem;
  }
  .locbar .loclabel { color: var(--ink); font-weight: 600; }
  .linklike {
    background: none; border: none; color: var(--accent); cursor: pointer;
    font-size: .85rem; padding: 0; text-decoration: underline;
  }
  .updated { font-size: .8rem; color: var(--muted); }
  .banner {
    border-radius: 14px; padding: 1rem 1.15rem; margin-bottom: 1.1rem;
    box-shadow: var(--shadow); display: flex; align-items: center; gap: .9rem;
    border: 1px solid var(--line); background: var(--card);
  }
  .banner.clear { border-color: color-mix(in srgb, var(--clear) 40%, transparent);
    background: color-mix(in srgb, var(--clear) 12%, var(--card)); }
  .banner .big { font-size: 1.15rem; font-weight: 700; letter-spacing: -.01em; }
  .banner .count {
    font-size: 1.9rem; font-weight: 800; line-height: 1; padding: .1rem .7rem;
    border-radius: 12px; color: var(--sev-ink); flex: none;
  }
  .banner .sub { color: var(--muted); font-size: .88rem; margin-top: .15rem; }
  .cards { display: flex; flex-direction: column; gap: .8rem; }
  .alert {
    background: var(--card); border: 1px solid var(--line);
    border-left: 6px solid var(--unknown); border-radius: 14px;
    box-shadow: var(--shadow); overflow: hidden;
  }
  .alert summary {
    list-style: none; cursor: pointer; padding: .85rem 1.05rem;
    display: flex; align-items: flex-start; gap: .7rem;
  }
  .alert summary::-webkit-details-marker { display: none; }
  .sev-badge {
    font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--sev-ink); padding: .2rem .5rem; border-radius: 6px; flex: none; margin-top: .15rem;
  }
  .a-main { flex: 1; min-width: 0; }
  .a-event { font-size: 1.05rem; font-weight: 700; letter-spacing: -.01em; }
  .a-meta { color: var(--muted); font-size: .82rem; margin-top: .2rem;
    display: flex; flex-wrap: wrap; gap: .3rem .9rem; }
  .a-head-headline { color: var(--ink); font-size: .9rem; margin-top: .35rem; opacity: .92; }
  .chev { color: var(--muted); font-size: .8rem; margin-top: .3rem; flex: none;
    transition: transform .15s; }
  .alert[open] .chev { transform: rotate(90deg); }
  .a-body { padding: 0 1.05rem 1rem; border-top: 1px dashed var(--line); margin: 0 0 0; }
  .a-body h4 { font-size: .72rem; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); margin: .9rem 0 .3rem; }
  .a-body p { white-space: pre-wrap; font-size: .9rem; line-height: 1.55; }
  .a-body .instruction { background: var(--accent-soft); border-radius: 10px;
    padding: .7rem .85rem; color: var(--ink); }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: .2rem .8rem;
    font-size: .84rem; margin-top: .5rem; }
  .kv dt { color: var(--muted); }
  .card-msg {
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    box-shadow: var(--shadow); padding: 1.6rem 1.4rem; text-align: center; color: var(--muted);
  }
  .card-msg .big { font-size: 1.15rem; color: var(--ink); margin-bottom: .4rem; font-weight: 600; }
  .field { margin: .8rem 0; text-align: left; }
  .field label { display: block; font-size: .8rem; color: var(--muted); margin-bottom: .3rem; }
  .field input {
    width: 100%; padding: .6rem .75rem; font-size: 1rem; color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px; background: var(--bg);
  }
  .field input:focus { outline: none; border-color: var(--accent); }
  .btn {
    border: none; border-radius: 10px; padding: .6rem 1rem; cursor: pointer;
    font-size: .92rem; font-weight: 600; background: var(--accent); color: var(--bg);
  }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--ink); }
  .row { display: flex; gap: .6rem; flex-wrap: wrap; justify-content: center; }
  .notice { font-size: .82rem; color: var(--muted); margin-top: .6rem; }
  .notify-toggle {
    border: 1px solid var(--line); background: var(--card); color: var(--muted);
    border-radius: 999px; padding: .28rem .7rem; cursor: pointer; font-size: .8rem;
  }
  .notify-toggle.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  /* v1 footer is slightly tighter than core's default */
  footer { font-size: .82rem; padding-top: 1rem; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← suite</a>
    <button class="theme-btn" id="themeBtn" title="Toggle light/dark">◐ theme</button>
  </div>
  <header>
    <h1>Severe Weather Alert Board</h1>
  </header>
  <div class="locbar">
    <span>Location:</span>
    <span class="loclabel" id="locLabel">—</span>
    <button class="linklike" id="changeLoc">change</button>
    <button class="notify-toggle" id="notifyBtn" title="Notify me when a new alert appears" aria-pressed="false">🔔 notify</button>
    <span class="updated" id="updated" style="margin-left:auto"></span>
  </div>

  <main id="main"></main>

  <footer id="footer">
    Data: National Weather Service · api.weather.gov. Alerts refresh every 5 minutes while this tab is open.
  </footer>
</div>

<script src="../core/suite.js" data-suite-inline></script>
<script>
"use strict";

Suite.theme.init();
Suite.location.watch();

/* ---------- shared location ---------- */
function getLocation() { return Suite.location.get(); }
function saveLocation(loc) { Suite.location.set(loc); }

/* ---------- utilities ---------- */
const $ = s => document.querySelector(s);
const mainEl = Suite.liveRegion($("#main"));
const locLabelEl = $("#locLabel");
const updatedEl = Suite.liveRegion($("#updated"));
const esc = Suite.esc;

/* ---------- cache: the v1 envelope on the v1 key ----------
   v1 stored {t, key, v} at suite.cache.alerts, where `key` is the location the
   payload belongs to. Suite.fetchJSON reads/writes {t, v} on the same key (so a
   v1 user's cache keeps working); the location key is re-attached after every
   fresh fetch so a cache from a different location is never rendered or served
   as an offline fallback. */
const CACHE_KEY = "suite.cache.alerts";
const TTL = 5 * 60 * 1000; /* manifest cacheTtlMin: 5 — matches the board's own refresh cadence */
function readCache() {
  const e = Suite.store.get(CACHE_KEY);
  return (e && typeof e === "object" && "t" in e && "v" in e) ? e : null;
}
function featuresOf(raw) { /* v1 cached the features array; fetchJSON caches the full response */
  const list = Array.isArray(raw) ? raw : (raw && raw.features) || [];
  return list.filter(f => f && f.properties);
}

function relTime(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " hr ago";
  return new Date(ms).toLocaleString([], { month:"short", day:"numeric", hour:"numeric", minute:"2-digit" });
}
function fmtTime(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (isNaN(d)) return null;
  const now = new Date();
  const sameDay = d.toDateString() === now.toDateString();
  return d.toLocaleString([], sameDay
    ? { hour:"numeric", minute:"2-digit" }
    : { weekday:"short", hour:"numeric", minute:"2-digit" });
}

/* ---------- severity model ---------- */
const SEV = {
  Extreme:  { rank: 5, col: "var(--extreme)",  label: "Extreme" },
  Severe:   { rank: 4, col: "var(--severe)",   label: "Severe" },
  Moderate: { rank: 3, col: "var(--moderate)", label: "Moderate" },
  Minor:    { rank: 2, col: "var(--minor)",    label: "Minor" },
  Unknown:  { rank: 1, col: "var(--unknown)",  label: "Unknown" }
};
function sevOf(a) { return SEV[a.severity] || SEV.Unknown; }

/* ---------- notifications ----------
   suite.alerts.notify is a bare "0"/"1" string in v1; Suite.store.get JSON-parses
   it to a number, so normalize through String() and keep writing bare strings. */
let notifyOn = String(Suite.store.get("suite.alerts.notify", "0")) === "1";
const notifyBtn = $("#notifyBtn");
function paintNotifyBtn() {
  const supported = "Notification" in window;
  notifyBtn.style.display = supported ? "" : "none";
  notifyBtn.classList.toggle("on", notifyOn && supported && Notification.permission === "granted");
  notifyBtn.setAttribute("aria-pressed", String(notifyOn));
  notifyBtn.textContent = notifyOn ? "🔔 notifying" : "🔔 notify";
}
notifyBtn.addEventListener("click", async () => {
  if (!("Notification" in window)) return;
  if (notifyOn) { notifyOn = false; Suite.store.set("suite.alerts.notify", "0"); paintNotifyBtn(); return; }
  let perm = Notification.permission;
  if (perm !== "granted") { try { perm = await Notification.requestPermission(); } catch(e) {} }
  if (perm === "granted") { notifyOn = true; Suite.store.set("suite.alerts.notify", "1"); }
  paintNotifyBtn();
});

const seenStored = Suite.store.get("suite.alerts.seen", []);
let seenIds = new Set(Array.isArray(seenStored) ? seenStored : []);
function maybeNotify(features) {
  const ids = features.map(f => f.properties.id || f.id);
  if (notifyOn && "Notification" in window && Notification.permission === "granted" && seenIds.size) {
    for (const f of features) {
      const id = f.properties.id || f.id;
      if (!seenIds.has(id)) {
        const p = f.properties;
        try { new Notification(p.event || "Weather alert", { body: (p.headline || p.areaDesc || "").slice(0, 140) }); } catch(e) {}
      }
    }
  }
  seenIds = new Set(ids);
  Suite.store.set("suite.alerts.seen", ids);
}

/* ---------- render ---------- */
function renderLoading() {
  mainEl.innerHTML = `<div class="card-msg"><div class="big">Checking for active alerts…</div>Contacting the National Weather Service.</div>`;
}

function renderAlerts(features, stampMs) {
  const loc = getLocation();
  updatedEl.textContent = stampMs ? "updated " + relTime(stampMs) : "";
  if (!features.length) {
    mainEl.innerHTML =
      `<div class="banner clear">
        <div class="count" style="background:var(--clear)">✓</div>
        <div><div class="big">No active alerts</div>
        <div class="sub">Nothing severe for ${esc(loc ? loc.label : "your area")} right now.</div></div>
      </div>`;
    return;
  }
  const sorted = features.slice().sort((a, b) => {
    const d = sevOf(b.properties).rank - sevOf(a.properties).rank;
    if (d) return d;
    return new Date(b.properties.effective || 0) - new Date(a.properties.effective || 0);
  });
  const top = sevOf(sorted[0].properties);
  const banner =
    `<div class="banner" style="border-color:${top.col}">
      <div class="count" style="background:${top.col}">${sorted.length}</div>
      <div><div class="big">${sorted.length === 1 ? "1 active alert" : sorted.length + " active alerts"}</div>
      <div class="sub">Most serious: <strong style="color:${top.col}">${esc(top.label)}</strong> · ${esc(loc ? loc.label : "your area")}</div></div>
    </div>`;

  const cards = sorted.map(f => {
    const p = f.properties;
    const sev = sevOf(p);
    const eff = fmtTime(p.onset || p.effective);
    const end = fmtTime(p.ends || p.expires);
    const desc = (p.description || "").trim();
    const instr = (p.instruction || "").trim();
    const meta = [];
    if (end) meta.push("Until " + esc(end));
    if (p.certainty && p.certainty !== "Unknown") meta.push(esc(p.certainty));
    if (p.urgency && p.urgency !== "Unknown") meta.push(esc(p.urgency));
    return `<details class="alert" style="border-left-color:${sev.col}">
      <summary>
        <span class="sev-badge" style="background:${sev.col}">${esc(sev.label)}</span>
        <span class="a-main">
          <span class="a-event">${esc(p.event || "Weather Alert")}</span>
          <span class="a-meta">${meta.map(m => "<span>" + m + "</span>").join("")}</span>
          ${p.headline ? `<span class="a-head-headline">${esc(p.headline)}</span>` : ""}
        </span>
        <span class="chev" aria-hidden="true">▶</span>
      </summary>
      <div class="a-body">
        ${instr ? `<h4>What to do</h4><p class="instruction">${esc(instr)}</p>` : ""}
        <h4>Details</h4>
        <p>${esc(desc || "No further detail provided.")}</p>
        <dl class="kv">
          ${p.areaDesc ? `<dt>Area</dt><dd>${esc(p.areaDesc)}</dd>` : ""}
          ${eff ? `<dt>Effective</dt><dd>${esc(eff)}</dd>` : ""}
          ${end ? `<dt>Expires</dt><dd>${esc(end)}</dd>` : ""}
          ${p.senderName ? `<dt>Issued by</dt><dd>${esc(p.senderName)}</dd>` : ""}
        </dl>
      </div>
    </details>`;
  }).join("");

  mainEl.innerHTML = banner + `<div class="cards">${cards}</div>`;
}

/* ---------- load ---------- */
let refreshTimer = null;
async function load() {
  const loc = getLocation();
  if (!loc) { renderFirstRun(); return; }
  locLabelEl.textContent = loc.label;
  let cached = readCache();
  if (cached && cached.key !== locKey(loc)) {
    /* the cache belongs to a different location — drop it so Suite.fetchJSON
       neither serves it fresh nor falls back to it offline */
    Suite.store.set(CACHE_KEY, null);
    cached = null;
  }
  if (cached) renderAlerts(featuresOf(cached.v), cached.t);
  else renderLoading();

  try {
    const url = `https://api.weather.gov/alerts/active?point=${loc.lat.toFixed(4)},${loc.lon.toFixed(4)}`;
    const r = await Suite.fetchJSON(url, { cacheKey: "alerts", ttl: TTL, accept: "application/geo+json" });
    const features = featuresOf(r.v);
    if (!r.fromCache) {
      /* fetchJSON wrote {t, v}; re-attach the v1 envelope's location key */
      const e = Suite.store.get(CACHE_KEY);
      if (e && typeof e === "object") { e.key = locKey(loc); Suite.store.set(CACHE_KEY, e); }
    }
    renderAlerts(features, r.t);
    if (r.stale) {
      updatedEl.textContent = "offline · last data " + relTime(r.t);
    } else if (!r.fromCache) {
      maybeNotify(features);
    }
  } catch(e) {
    mainEl.innerHTML =
      `<div class="card-msg"><div class="big">Couldn't reach the alert service</div>
       ${esc(e.message || e)}. It will keep trying automatically.
       <div class="row" style="margin-top:1rem"><button class="btn" id="retry">Try again</button></div></div>`;
    const rb = $("#retry"); if (rb) rb.addEventListener("click", load);
  }
}
function locKey(loc) { return loc.lat.toFixed(3) + "," + loc.lon.toFixed(3); }

/* ---------- first-run / change location ---------- */
function renderFirstRun(msg) {
  locLabelEl.textContent = "not set";
  mainEl.innerHTML =
    `<div class="card-msg">
      <div class="big">Where should this board watch?</div>
      This alert board covers the United States and its territories (National Weather Service).
      ${msg ? `<div class="notice" style="color:var(--severe)">${esc(msg)}</div>` : ""}
      <div class="field"><label for="zip">US ZIP code</label>
        <input id="zip" inputmode="numeric" placeholder="e.g. 10001" maxlength="5"></div>
      <div class="row">
        <button class="btn" id="zipGo">Set location</button>
        <button class="btn ghost" id="geoGo">Use my location</button>
      </div>
      <div class="notice" id="locMsg"></div>
    </div>`;
  const zip = $("#zip"), locMsg = Suite.liveRegion($("#locMsg"));
  zip.focus();
  zip.addEventListener("keydown", e => { if (e.key === "Enter") $("#zipGo").click(); });
  $("#zipGo").addEventListener("click", async () => {
    const z = (zip.value || "").trim();
    if (!/^\d{5}$/.test(z)) { locMsg.textContent = "Enter a 5-digit ZIP code."; return; }
    locMsg.textContent = "Looking up…";
    try {
      const r = await Suite.fetchJSON(`https://api.zippopotam.us/us/${z}`, { accept: "application/json" });
      const place = r.v.places && r.v.places[0];
      if (!place) throw new Error("ZIP not found");
      saveLocation({
        lat: parseFloat(place.latitude), lon: parseFloat(place.longitude),
        label: `${place["place name"]}, ${place["state abbreviation"]} ${z}`
      });
      load();
    } catch(e) { locMsg.textContent = "Couldn't find that ZIP (" + (e.message || e) + ")."; }
  });
  $("#geoGo").addEventListener("click", () => {
    if (!navigator.geolocation) { locMsg.textContent = "Geolocation isn't available here."; return; }
    locMsg.textContent = "Requesting location… (may need http/https)";
    navigator.geolocation.getCurrentPosition(
      pos => {
        saveLocation({
          lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4),
          label: `My location (${pos.coords.latitude.toFixed(3)}, ${pos.coords.longitude.toFixed(3)})`
        });
        load();
      },
      err => { locMsg.textContent = "Couldn't get location: " + err.message; }
    );
  });
}
$("#changeLoc").addEventListener("click", () => { renderFirstRun(); });

/* ---------- boot ---------- */
paintNotifyBtn();
function startTimer() { if (refreshTimer) clearInterval(refreshTimer); refreshTimer = setInterval(load, 5 * 60 * 1000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
startTimer();
load();

/* First run: no location saved anywhere yet — ask the browser once and reload into
   the normal view. Inert when a location exists, when the user turned detection off
   in Settings, or when a previous request was refused (core: Suite.location). */
Suite.location.autoBoot();
</script>
</body>
</html>
