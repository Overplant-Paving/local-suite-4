<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earthquake Monitor · Local Suite</title>
<link rel="stylesheet" href="../core/suite.css" data-suite-inline>
<style>
  /* tool accents (3-layer, same pattern as core): ocean backdrop for the map, plus
     Phase 4 a11y theme-split status colors (single hexes failed WCAG AA in one theme):
     --tsu tsunami marker, --stale the amber "connection issue" stamp, --errsoft the
     inline setup error. */
  :root{ --ocean:#eae6dc; --tsu:#c23b3b; --stale:#986424; --errsoft:#b65b37; }
  @media (prefers-color-scheme:dark){ :root{ --ocean:#12151a; --tsu:#e0685a; --stale:#c07f2d; --errsoft:#c6704e; } }
  :root[data-theme="light"]{ --ocean:#eae6dc; --tsu:#c23b3b; --stale:#986424; --errsoft:#b65b37; }
  :root[data-theme="dark"]{ --ocean:#12151a; --tsu:#e0685a; --stale:#c07f2d; --errsoft:#c6704e; }

  body{padding:1.4rem 1.25rem 4rem;}
  .wrap{max-width:1060px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
  /* v1 quakes uses the pill-style back link, not the core bare link */
  .back{font-size:.85rem;text-decoration:none;color:var(--muted);
    border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .8rem;}
  .back:hover{color:var(--ink);text-decoration:none}
  .theme-btn{margin-left:auto;float:none}
  header h1{font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:.5rem}
  header .tag{color:var(--muted);margin-top:.25rem;font-size:.92rem}
  .locbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .2rem;
    font-size:.9rem;color:var(--muted)}
  .locbar b{color:var(--ink);font-weight:600}
  .linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;padding:0;text-decoration:underline}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:1rem 1.05rem;box-shadow:var(--shadow);display:block;flex-direction:row;gap:normal}
  .controls{display:flex;gap:1.1rem;flex-wrap:wrap;align-items:flex-end;margin:1rem 0}
  .ctl{display:flex;flex-direction:column;gap:.3rem}
  .ctl label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .ctl .val{color:var(--accent);font-weight:600}
  select,input[type=range]{accent-color:var(--accent)}
  select{padding:.4rem .6rem;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:.9rem}
  input[type=range]{width:150px}
  input[type=text]{padding:.45rem .6rem;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:.95rem}
  .stats{display:flex;gap:1.6rem;flex-wrap:wrap;margin:.2rem 0 1rem}
  .stat b{font-size:1.5rem;display:block;line-height:1.15;color:var(--accent)}
  .stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .mapcard{padding:.6rem}
  svg.map{display:block;width:100%;height:auto;background:var(--ocean);border-radius:9px}
  .grat{stroke:var(--line);stroke-width:.5;fill:none}
  .grat.eq{stroke:var(--muted);stroke-width:.7;opacity:.6}
  .qdot{stroke:rgba(0,0,0,.35);stroke-width:.4}
  .home{fill:none;stroke:var(--accent);stroke-width:1.4}
  .legend{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:.5rem;font-size:.78rem;color:var(--muted);align-items:center;padding:0 .3rem}
  .legend .sw{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.3rem;vertical-align:-1px}
  .list{margin-top:1.2rem;display:flex;flex-direction:column;gap:.5rem}
  .q{display:grid;grid-template-columns:auto 1fr auto;gap:.85rem;align-items:center;
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:.7rem .9rem;box-shadow:var(--shadow)}
  .q.new{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .badge{font-weight:700;font-size:1.05rem;color:#fff;border-radius:9px;
    min-width:2.9rem;text-align:center;padding:.35rem .3rem;line-height:1.1}
  .badge small{display:block;font-size:.55rem;font-weight:600;opacity:.9;letter-spacing:.05em}
  .q .place{font-size:.95rem;font-weight:500}
  .q .place a{text-decoration:none}
  .q .meta{font-size:.78rem;color:var(--muted);margin-top:.1rem}
  .q .newtag{display:inline-block;font-size:.62rem;font-weight:700;color:var(--accent);
    border:1px solid var(--accent);border-radius:6px;padding:0 .3rem;margin-left:.4rem;vertical-align:1px;letter-spacing:.04em}
  .q .right{text-align:right;font-size:.78rem;color:var(--muted);white-space:nowrap}
  .q .right b{display:block;color:var(--ink);font-size:.85rem;font-weight:600}
  .msg{padding:2.4rem 1rem;text-align:center;color:var(--muted)}
  .msg .big{font-size:1.15rem;color:var(--ink);margin-bottom:.4rem}
  .stamp{font-size:.78rem;color:var(--muted);margin-top:.3rem}
  .stamp.err{color:var(--stale)}
  footer{margin-top:2.6rem;font-size:.82rem;padding-top:1rem}
  /* first-run location card */
  .setup{max-width:440px;margin:2rem auto}
  .setup h2{font-size:1.2rem;margin-bottom:.3rem}
  .setup p{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
  .setup .row{display:flex;gap:.5rem;margin-bottom:.7rem}
  .setup input{flex:1}
  .btn{border:none;border-radius:9px;padding:.55rem .9rem;cursor:pointer;font-size:.9rem;font-weight:600}
  .btn.primary{background:var(--accent);color:var(--bg)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .err-inline{color:var(--errsoft);font-size:.82rem;min-height:1.1rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← suite</a>
    <button class="theme-btn" id="themeBtn" title="Toggle light/dark">◐ theme</button>
  </div>
  <header>
    <h1>🌎 Earthquake Monitor</h1>
    <p class="tag">Live quakes from USGS, filterable by magnitude and distance, plotted on a world grid.</p>
  </header>

  <div id="app"></div>

  <footer>
    Data: U.S. Geological Survey · earthquake.usgs.gov GeoJSON feeds. Times shown in your local zone.
    Refreshes every 5 minutes; cached locally between visits.
  </footer>
</div>

<script src="../core/suite.js" data-suite-inline></script>
<script>
"use strict";

Suite.theme.init();
Suite.location.watch();

/* ---------- shared suite helpers ---------- */
const esc = Suite.esc;
function getLoc(){ return Suite.location.get(); }
function setLoc(l){ Suite.location.set(l); }

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,r=Math.PI/180;
  const dLa=(lat2-lat1)*r, dLo=(lon2-lon1)*r;
  const s=Math.sin(dLa/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function relTime(ms){
  const d=Math.round((Date.now()-ms)/1000);
  if(d<60) return d+"s ago";
  if(d<3600) return Math.round(d/60)+"m ago";
  if(d<86400) return Math.round(d/3600)+"h ago";
  return Math.round(d/86400)+"d ago";
}

/* ---------- magnitude color scale (USGS-ish) ---------- */
function magColor(m){
  if(m==null) return "#9aa0a8";
  if(m<2.5) return "#6a9e57";
  if(m<4)   return "#c9a227";
  if(m<5)   return "#e08a2e";
  if(m<6)   return "#d9622b";
  if(m<7)   return "#c23b3b";
  return "#8f2d6b";
}
/* Phase 4 a11y: badge text ink per band — white text failed WCAG AA (4.5:1) on the
   four lighter band colors, dark ink passes on all of them; white stays on M6+. */
function magInk(m){ return (m!=null && m>=6) ? "#fff" : "#16191d"; }

/* ---------- app state ---------- */
const TTL = 5*60*1000; // manifest cacheTtlMin: 5 — the quakes-class good-citizen interval
const FEEDS={
  all_day:{url:"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson",label:"All · past day"},
  "2.5_week":{url:"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_week.geojson",label:"M2.5+ · past week"},
  significant_month:{url:"https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/significant_month.geojson",label:"Significant · past month"}
};
const state={
  feed: Suite.store.get("suite.quakes.feed") || "all_day",
  minMag: parseFloat(Suite.store.get("suite.quakes.minMag", "0")),
  maxDist: parseFloat(Suite.store.get("suite.quakes.maxDist", "20000")), // km, 20000 ≈ all
  data:null, stamp:null, error:null
};
let refreshTimer=null;

const appEl=document.getElementById("app");

/* ---------- first-run location setup ---------- */
function renderSetup(){
  clearInterval(refreshTimer);
  appEl.innerHTML=`
    <div class="card setup">
      <h2>Set your location</h2>
      <p>The monitor filters and centers on your spot. Enter a US ZIP, or use your device location.
         This is saved for the whole suite.</p>
      <div class="row">
        <input type="text" id="zip" inputmode="numeric" placeholder="US ZIP e.g. 90012" maxlength="5" aria-label="US ZIP code">
        <button class="btn primary" id="zipBtn">Set</button>
      </div>
      <div class="row">
        <button class="btn ghost" id="geoBtn" style="flex:1">Use my location</button>
      </div>
      <div class="err-inline" id="setupErr"></div>
    </div>`;
  const zip=document.getElementById("zip");
  const err=Suite.liveRegion(document.getElementById("setupErr"));
  document.getElementById("zipBtn").addEventListener("click", async()=>{
    const z=zip.value.trim(); err.textContent="";
    if(!/^\d{5}$/.test(z)){ err.textContent="Enter a 5-digit ZIP."; return; }
    try{
      const d=(await Suite.fetchJSON(`https://api.zippopotam.us/us/${z}`)).v;
      const p=d.places[0];
      setLoc({lat:parseFloat(p.latitude),lon:parseFloat(p.longitude),label:`${p["place name"]}, ${p["state abbreviation"]}`});
      boot();
    }catch(e){ err.textContent="Couldn't find that ZIP. Try another."; }
  });
  zip.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("zipBtn").click(); });
  document.getElementById("geoBtn").addEventListener("click", ()=>{
    if(!navigator.geolocation){ err.textContent="Geolocation isn't available here."; return; }
    err.textContent="Locating…";
    navigator.geolocation.getCurrentPosition(
      pos=>{ setLoc({lat:+pos.coords.latitude.toFixed(4),lon:+pos.coords.longitude.toFixed(4),label:"My location"}); boot(); },
      e=>{ err.textContent="Location denied. Try a ZIP instead (may need http://)."; }
    );
  });
}

/* ---------- main dashboard shell ---------- */
function renderShell(){
  const loc=getLoc();
  const feedOpts=Object.entries(FEEDS).map(([k,v])=>`<option value="${k}"${k===state.feed?" selected":""}>${v.label}</option>`).join("");
  appEl.innerHTML=`
    <div class="locbar">
      <span>Centered on <b id="locLabel"></b></span>
      <button class="linkbtn" id="changeLoc">change</button>
    </div>
    <div class="controls card">
      <div class="ctl">
        <label for="feedSel">Feed</label>
        <select id="feedSel">${feedOpts}</select>
      </div>
      <div class="ctl">
        <label for="minMag">Min magnitude · <span class="val" id="minMagVal"></span></label>
        <input type="range" id="minMag" min="0" max="7" step="0.5" value="${state.minMag}">
      </div>
      <div class="ctl">
        <label for="maxDist">Within · <span class="val" id="maxDistVal"></span></label>
        <input type="range" id="maxDist" min="250" max="20000" step="250" value="${state.maxDist}">
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div class="card mapcard" id="mapCard"></div>
    <div id="stamp" class="stamp"></div>
    <div class="list" id="list"></div>`;

  document.getElementById("locLabel").textContent=loc?loc.label:"—";
  document.getElementById("changeLoc").addEventListener("click", renderSetup);
  document.getElementById("minMagVal").textContent="M"+state.minMag.toFixed(1);
  document.getElementById("maxDistVal").textContent=distLabel(state.maxDist);
  Suite.liveRegion(document.getElementById("stats"));
  Suite.liveRegion(document.getElementById("stamp"));

  const feedSel=document.getElementById("feedSel");
  feedSel.addEventListener("change", ()=>{ state.feed=feedSel.value; Suite.store.set("suite.quakes.feed",state.feed); load(); });
  const minMag=document.getElementById("minMag");
  minMag.addEventListener("input", ()=>{ state.minMag=parseFloat(minMag.value); Suite.store.set("suite.quakes.minMag",state.minMag);
    document.getElementById("minMagVal").textContent="M"+state.minMag.toFixed(1); renderData(); });
  const maxDist=document.getElementById("maxDist");
  maxDist.addEventListener("input", ()=>{ state.maxDist=parseFloat(maxDist.value); Suite.store.set("suite.quakes.maxDist",state.maxDist);
    document.getElementById("maxDistVal").textContent=distLabel(state.maxDist); renderData(); });
}
function distLabel(km){ return km>=20000?"anywhere":`${Math.round(km)} km`; }

/* ---------- seen-quake tracking for new-quake highlight ---------- */
function seenSet(){ try{ return new Set(Suite.store.get("suite.quakes.seen", [])); }catch(e){ return new Set(); } }
function saveSeen(ids){ Suite.store.set("suite.quakes.seen", ids.slice(0,600)); }

/* ---------- data load ---------- */
async function load(){
  const key=state.feed;
  // instant paint from the cache envelope while the (possible) network fetch runs — v1 behavior
  const cached=Suite.store.get("suite.cache.quakes."+key);
  if(cached && typeof cached==="object" && "v" in cached){
    state.data=cached.v; state.stamp=cached.t; state.error=null; renderData();
  }
  try{
    const r=await Suite.fetchJSON(FEEDS[state.feed].url, {cacheKey:"quakes."+key, ttl:TTL});
    state.data=r.v; state.stamp=r.t;
    state.error=r.stale ? "offline — showing cached data" : null;
    renderData();
  }catch(e){
    state.error=e.message||String(e);
    if(!state.data) renderData(); else renderStamp();
  }
}

/* ---------- render data ---------- */
let firstRenderDone=false;
function renderData(){
  const loc=getLoc();
  const listEl=document.getElementById("list");
  if(!listEl) return;
  renderStamp();

  if(!state.data){
    document.getElementById("mapCard").innerHTML="";
    listEl.innerHTML=`<div class="card msg"><div class="big">Couldn't reach USGS</div>
      No cached quakes to show yet. Check your connection; the monitor will retry automatically.</div>`;
    document.getElementById("stats").innerHTML="";
    return;
  }

  const seen=seenSet();
  let feats=(state.data.features||[]).map(f=>{
    const p=f.properties, g=f.geometry&&f.geometry.coordinates||[];
    const lon=g[0], lat=g[1], depth=g[2];
    const dist=(loc&&isFinite(lat)&&isFinite(lon))?haversineKm(loc.lat,loc.lon,lat,lon):null;
    return {id:f.id, mag:p.mag, place:p.place, time:p.time, url:p.url, tsunami:p.tsunami,
            lat,lon,depth,dist, isNew:!seen.has(f.id)};
  });

  // filter
  let shown=feats.filter(q=>(q.mag==null||q.mag>=state.minMag) &&
    (state.maxDist>=20000 || q.dist==null || q.dist<=state.maxDist));
  // sort by time desc
  shown.sort((a,b)=>b.time-a.time);

  // stats
  const largest=shown.reduce((m,q)=>(q.mag!=null&&q.mag>m)?q.mag:m,-Infinity);
  const newCount=firstRenderDone?shown.filter(q=>q.isNew).length:0;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><b>${shown.length}</b><span>shown</span></div>
    <div class="stat"><b>${largest>-Infinity?"M"+largest.toFixed(1):"—"}</b><span>largest</span></div>
    <div class="stat"><b>${loc&&shown.length&&shown.some(q=>q.dist!=null)?Math.round(Math.min(...shown.filter(q=>q.dist!=null).map(q=>q.dist)))+" km":"—"}</b><span>nearest</span></div>
    ${firstRenderDone?`<div class="stat"><b>${newCount}</b><span>new</span></div>`:""}`;

  drawMap(shown, loc);
  renderList(shown, listEl);

  // record seen for next refresh (all feature ids, not just filtered)
  saveSeen(feats.map(q=>q.id));
  firstRenderDone=true;
}

function renderStamp(){
  const el=document.getElementById("stamp");
  if(!el) return;
  let s="";
  if(state.stamp){
    const age=Date.now()-state.stamp;
    const fresh=age<6*60*1000;
    s=`Data from ${new Date(state.stamp).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}` +
      (fresh?"":" · showing cached, retrying");
  }
  if(state.error){ el.className="stamp err"; el.textContent=(s?s+" · ":"")+"connection issue: "+state.error; }
  else { el.className="stamp"; el.textContent=s; }
}

/* ---------- equirectangular SVG map ---------- */
function drawMap(quakes, loc){
  const W=980, H=490;
  const px=lon=>(lon+180)/360*W;
  const py=lat=>(90-lat)/180*H;
  let g="";
  // graticule every 30°
  for(let lon=-180;lon<=180;lon+=30){ const x=px(lon).toFixed(1); g+=`<line class="grat" x1="${x}" y1="0" x2="${x}" y2="${H}"/>`; }
  for(let lat=-90;lat<=90;lat+=30){ const y=py(lat).toFixed(1); const cls=lat===0?"grat eq":"grat"; g+=`<line class="${cls}" x1="0" y1="${y}" x2="${W}" y2="${y}"/>`; }
  // equator + prime meridian labels
  g+=`<text x="4" y="${(py(0)-4).toFixed(1)}" font-size="9" fill="var(--muted)">Equator</text>`;

  // quake dots — smaller first so big ones sit on top
  const sorted=[...quakes].sort((a,b)=>(a.mag||0)-(b.mag||0));
  let dots="";
  for(const q of sorted){
    if(!isFinite(q.lat)||!isFinite(q.lon)) continue;
    const r=Math.max(1.6, q.mag!=null? (q.mag*q.mag)/7+1.6 : 1.6);
    const op=q.isNew&&firstRenderDone?1:0.82;
    dots+=`<circle class="qdot" cx="${px(q.lon).toFixed(1)}" cy="${py(q.lat).toFixed(1)}" r="${r.toFixed(1)}" fill="${magColor(q.mag)}" fill-opacity="${op}">`+
          `<title>M${q.mag!=null?q.mag.toFixed(1):"?"} — ${esc(q.place)}</title></circle>`;
  }
  let home="";
  if(loc){
    const hx=px(loc.lon).toFixed(1), hy=py(loc.lat).toFixed(1);
    home=`<g><line class="home" x1="${hx-6}" y1="${hy}" x2="${hx+6}" y2="${hy}"/>`+
         `<line class="home" x1="${hx}" y1="${hy-6}" x2="${hx}" y2="${hy+6}"/>`+
         `<circle class="home" cx="${hx}" cy="${hy}" r="7"/></g>`;
  }
  const legend=[["<2.5","#6a9e57"],["2.5–4","#c9a227"],["4–5","#e08a2e"],["5–6","#d9622b"],["6–7","#c23b3b"],["7+","#8f2d6b"]]
    .map(([l,c])=>`<span><span class="sw" style="background:${c}"></span>${l}</span>`).join("");

  document.getElementById("mapCard").innerHTML=
    `<svg class="map" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="World map of recent earthquakes">`+
      g+dots+home+`</svg>`+
    `<div class="legend">${legend}<span style="margin-left:auto">dot size ∝ magnitude · ✛ you</span></div>`;
}

/* ---------- list ---------- */
function renderList(quakes, listEl){
  if(!quakes.length){
    listEl.innerHTML=`<div class="card msg"><div class="big">No quakes match</div>
      Nothing in this feed passes your magnitude and distance filters. Widen them, or pick a broader feed.</div>`;
    return;
  }
  const loc=getLoc();
  listEl.innerHTML=quakes.slice(0,250).map(q=>{
    const col=magColor(q.mag);
    const magTxt=q.mag!=null?q.mag.toFixed(1):"?";
    const depthTxt=isFinite(q.depth)?`${Math.round(q.depth)} km deep`:"";
    const distTxt=(q.dist!=null)?`${Math.round(q.dist).toLocaleString()} km away`:"";
    const meta=[depthTxt,distTxt].filter(Boolean).join(" · ");
    const tsu=q.tsunami?` · <span style="color:var(--tsu)">tsunami</span>`:"";
    const isNew=q.isNew&&firstRenderDone;
    return `<div class="q${isNew?" new":""}">
      <div class="badge" style="background:${col};color:${magInk(q.mag)}"><small>M</small>${magTxt}</div>
      <div>
        <div class="place">${q.url?`<a href="${esc(q.url)}" target="_blank" rel="noopener">${esc(q.place)||"Unknown location"}</a>`:esc(q.place)||"Unknown location"}${isNew?`<span class="newtag">NEW</span>`:""}</div>
        <div class="meta">${meta}${tsu}</div>
      </div>
      <div class="right"><b>${relTime(q.time)}</b>${new Date(q.time).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}</div>
    </div>`;
  }).join("");
}

/* ---------- boot ---------- */
function boot(){
  if(!getLoc()){ renderSetup(); return; }
  renderShell();
  load();
  clearInterval(refreshTimer);
  refreshTimer=setInterval(load, 5*60*1000);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && getLoc()) load(); });
boot();

/* First run: no location saved anywhere yet — ask the browser once and reload into
   the normal view. Inert when a location exists, when the user turned detection off
   in Settings, or when a previous request was refused (core: Suite.location). */
Suite.location.autoBoot();
</script>
</body>
</html>
