<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>River &amp; Streamflow Gauges · Local Suite</title>
<link rel="stylesheet" href="../core/suite.css" data-suite-inline>
<style>
  /* tool accents (3-layer, same pattern as core).
     Phase 4 a11y: light --star darkened #d9a521 -> #b88c1c (the ★ glyph needs 3:1
     against the card); --stale / --errsoft are theme-split status colors (single
     hexes failed WCAG AA in one theme). */
  :root{ --water:#2f6f9a; --star:#b88c1c; --stale:#986424; --errsoft:#b65b37; }
  @media (prefers-color-scheme:dark){ :root{ --water:#66a9d6; --star:#e0b64a; --stale:#c07f2d; --errsoft:#c6704e; } }
  :root[data-theme="light"]{ --water:#2f6f9a; --star:#b88c1c; --stale:#986424; --errsoft:#b65b37; }
  :root[data-theme="dark"]{ --water:#66a9d6; --star:#e0b64a; --stale:#c07f2d; --errsoft:#c6704e; }

  body{padding:1.4rem 1.25rem 4rem;}
  .wrap{max-width:1060px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
  /* v1 rivers uses the pill-style back link, not the core bare link */
  .back{font-size:.85rem;text-decoration:none;color:var(--muted);
    border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .8rem;}
  .back:hover{color:var(--ink);text-decoration:none}
  .theme-btn{margin-left:auto;float:none}
  header h1{font-size:1.6rem;letter-spacing:-.02em}
  header .tag{color:var(--muted);margin-top:.25rem;font-size:.92rem}
  .locbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .2rem;
    font-size:.9rem;color:var(--muted)}
  .locbar b{color:var(--ink);font-weight:600}
  .linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;padding:0;text-decoration:underline}
  h2.sec{font-size:1.05rem;margin:1.6rem 0 .6rem;display:flex;align-items:baseline;gap:.5rem}
  h2.sec .n{font-size:.8rem;color:var(--muted);font-weight:500}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:.8rem}
  .gauge{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:.85rem .95rem;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:.5rem}
  .gauge .g-top{display:flex;gap:.5rem;align-items:flex-start}
  .gauge h3{font-size:.95rem;font-weight:600;line-height:1.3;flex:1}
  .gauge h3 a{text-decoration:none}
  /* Phase 4 a11y: the unstarred ☆ was var(--line) (~1.3:1 vs the card — invisible); muted passes 3:1 */
  .starbtn{background:none;border:none;cursor:pointer;font-size:1.15rem;line-height:1;color:var(--muted);flex:none;padding:0}
  .starbtn.on{color:var(--star)}
  .g-sub{font-size:.76rem;color:var(--muted)}
  .readings{display:flex;gap:1.4rem;margin-top:.15rem}
  .reading b{font-size:1.5rem;color:var(--water);display:block;line-height:1.1;font-weight:700}
  .reading b small{font-size:.85rem;color:var(--muted);font-weight:500}
  .reading span{font-size:.68rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .reading.none b{color:var(--muted);font-size:1.05rem}
  .g-time{font-size:.72rem;color:var(--muted)}
  .g-time.stale{color:var(--stale)}
  .msg{padding:2.2rem 1rem;text-align:center;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .msg .big{font-size:1.1rem;color:var(--ink);margin-bottom:.4rem}
  .stamp{font-size:.78rem;color:var(--muted);margin:.7rem 0}
  .stamp.err{color:var(--stale)}
  .note{font-size:.8rem;color:var(--muted);background:var(--chip);border-radius:9px;padding:.6rem .8rem;margin-top:.8rem}
  .skel{background:var(--chip);border-radius:14px;height:120px;animation:pulse 1.3s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){.skel{animation:none}}
  footer{margin-top:2.6rem;font-size:.82rem;padding-top:1rem}
  .setup{max-width:440px;margin:2rem auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;box-shadow:var(--shadow)}
  .setup h2{font-size:1.2rem;margin-bottom:.3rem}
  .setup p{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
  .setup .row{display:flex;gap:.5rem;margin-bottom:.7rem}
  .setup input{flex:1}
  input[type=text]{padding:.5rem .65rem;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:.95rem}
  .btn{border:none;border-radius:9px;padding:.55rem .9rem;cursor:pointer;font-size:.9rem;font-weight:600}
  .btn.primary{background:var(--accent);color:var(--bg)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .err-inline{color:var(--errsoft);font-size:.82rem;min-height:1.1rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← suite</a>
    <button class="theme-btn" id="themeBtn" title="Toggle light/dark">◐ theme</button>
  </div>
  <header>
    <h1>🏞️ River &amp; Streamflow Gauges</h1>
    <p class="tag">Live gauge height and discharge for streams near you. Star the ones you follow.</p>
  </header>

  <div id="app"></div>

  <footer>
    Data: USGS Water Data (new API) · api.waterdata.usgs.gov — discharge (param 00060) and gauge height (00065).
    Refreshes about every 15 minutes; favorites saved on this device.
  </footer>
</div>

<script src="../core/suite.js" data-suite-inline></script>
<script>
"use strict";

Suite.theme.init();
Suite.location.watch();

/* ---------- shared suite helpers ---------- */
const esc=Suite.esc;
function getLoc(){ return Suite.location.get(); }
function setLoc(l){ Suite.location.set(l); }

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,r=Math.PI/180;
  const dLa=(lat2-lat1)*r, dLo=(lon2-lon1)*r;
  const s=Math.sin(dLa/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function titleCase(s){ return String(s||"").toLowerCase().replace(/\b([a-z])/g,(m,c)=>c.toUpperCase()).replace(/\bNr\b/g,"near").replace(/\bBl\b/g,"below").replace(/\bAb\b/g,"above").replace(/\bR\b/g,"River").replace(/\bC\b/g,"Creek"); }

/* ---------- API ---------- */
const BASE="https://api.waterdata.usgs.gov/ogcapi/v0/collections";
/* v1 appended "&application=local-suite" per catalog etiquette, but the OGC API now
   rejects unknown query params as property filters (HTTP 400 InvalidQuery, verified
   2026-07-15) — v1's live fetch is broken by this today. The param is dropped; the
   response shape is unchanged. Browser JS cannot set User-Agent, so there is no
   remaining self-identification channel for this API. */
const TTL=15*60*1000; // manifest cacheTtlMin: 15 — matches the USGS ~15-min gauge transmission cadence and v1's refresh interval

/* ---------- cache: the v1 envelope at the v1 key (suite.cache.rivers.near_<lat>_<lon>).
   v1 cached the GROUPED gauge list (computed from two requests), not raw responses, so
   the manual envelope is kept for byte-identical key parity; Suite.fetchJSON is the
   transport underneath. ---------- */
function cacheGet(key){ const e=Suite.store.get("suite.cache.rivers."+key); return (e&&typeof e==="object"&&"t" in e&&"v" in e)?e:null; }
function cacheSet(key,v){ Suite.store.set("suite.cache.rivers."+key,{t:Date.now(),v}); }

/* ---------- favorites ---------- */
function favs(){ const a=Suite.store.get("suite.rivers.favs", []); return Array.isArray(a)?a:[]; }
function saveFavs(a){ Suite.store.set("suite.rivers.favs", a); }
function isFav(id){ return favs().some(f=>f.id===id); }
function toggleFav(g){
  let a=favs();
  if(a.some(f=>f.id===g.id)) a=a.filter(f=>f.id!==g.id);
  else a.push({id:g.id,name:g.name,lat:g.lat,lon:g.lon});
  saveFavs(a);
}

const appEl=document.getElementById("app");
let refreshTimer=null;

/* ---------- first-run location ---------- */
function renderSetup(){
  clearInterval(refreshTimer);
  appEl.innerHTML=`
    <div class="setup">
      <h2>Set your location</h2>
      <p>The board finds stream gauges near you. Enter a US ZIP, or use your device location.
         This is saved for the whole suite.</p>
      <div class="row">
        <input type="text" id="zip" inputmode="numeric" placeholder="US ZIP e.g. 59718" maxlength="5" aria-label="US ZIP code">
        <button class="btn primary" id="zipBtn">Set</button>
      </div>
      <div class="row"><button class="btn ghost" id="geoBtn" style="flex:1">Use my location</button></div>
      <div class="err-inline" id="setupErr"></div>
    </div>`;
  const zip=document.getElementById("zip");
  const err=Suite.liveRegion(document.getElementById("setupErr"));
  document.getElementById("zipBtn").addEventListener("click", async()=>{
    const z=zip.value.trim(); err.textContent="";
    if(!/^\d{5}$/.test(z)){ err.textContent="Enter a 5-digit ZIP."; return; }
    try{ const d=(await Suite.fetchJSON(`https://api.zippopotam.us/us/${z}`)).v; const p=d.places[0];
      setLoc({lat:parseFloat(p.latitude),lon:parseFloat(p.longitude),label:`${p["place name"]}, ${p["state abbreviation"]}`}); boot();
    }catch(e){ err.textContent="Couldn't find that ZIP. Try another."; }
  });
  zip.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("zipBtn").click(); });
  document.getElementById("geoBtn").addEventListener("click", ()=>{
    if(!navigator.geolocation){ err.textContent="Geolocation isn't available here."; return; }
    err.textContent="Locating…";
    navigator.geolocation.getCurrentPosition(
      pos=>{ setLoc({lat:+pos.coords.latitude.toFixed(4),lon:+pos.coords.longitude.toFixed(4),label:"My location"}); boot(); },
      e=>{ err.textContent="Location denied. Try a ZIP instead (may need http://)."; });
  });
}

/* ---------- shell ---------- */
function renderShell(){
  const loc=getLoc();
  appEl.innerHTML=`
    <div class="locbar"><span>Near <b>${esc(loc.label)}</b></span><button class="linkbtn" id="changeLoc">change</button></div>
    <div id="stamp" class="stamp"></div>
    <div id="favSec"></div>
    <div id="nearSec"></div>
    <div class="note">Readings are provisional and unreviewed. This new USGS API serves live gauge height and
      discharge; formal flood-stage categories (action/minor/major) live in NWS AHPS, not here — treat rising
      gauge height as your flood cue and confirm with local warnings.</div>`;
  document.getElementById("changeLoc").addEventListener("click", renderSetup);
  Suite.liveRegion(document.getElementById("stamp"));
}

/* ---------- build a gauge object from grouped latest-continuous features ---------- */
function param(props){
  // returns {value, unit} formatting
  return {v:props.value, unit:props.unit_of_measure, time:props.time};
}

async function fetchNear(loc){
  // bbox ~ +/-0.55deg. lon width widened a touch by latitude handled loosely.
  const dLat=0.55, dLon=0.55/Math.max(0.3,Math.cos(loc.lat*Math.PI/180));
  const bbox=[loc.lon-dLon, loc.lat-dLat, loc.lon+dLon, loc.lat+dLat].map(n=>n.toFixed(4)).join(",");
  const url=`${BASE}/latest-continuous/items?bbox=${bbox}&parameter_code=00060,00065&limit=400&f=json`;
  const nameUrl=`${BASE}/monitoring-locations/items?bbox=${bbox}&limit=400&f=json`;
  const [latest,names]=await Promise.allSettled([Suite.fetchJSON(url), Suite.fetchJSON(nameUrl)]);
  if(latest.status!=="fulfilled") throw (latest.reason||new Error("fetch failed"));
  const nameMap={};
  if(names.status==="fulfilled"){
    for(const f of (names.value.v.features||[])){ const p=f.properties; if(p&&p.id) nameMap[p.id]=p.monitoring_location_name; }
  }
  return groupGauges(latest.value.v.features||[], nameMap, loc);
}

function groupGauges(features, nameMap, loc){
  const by={};
  for(const f of features){
    const p=f.properties||{}; const id=p.monitoring_location_id; if(!id) continue;
    const g=f.geometry&&f.geometry.coordinates||[];
    if(!by[id]) by[id]={id, name:titleCase(nameMap[id]||id.replace(/^USGS-/,"Gauge ")), lon:g[0], lat:g[1], q:null, h:null};
    if(p.parameter_code==="00060") by[id].q=param(p);
    else if(p.parameter_code==="00065") by[id].h=param(p);
  }
  const list=Object.values(by);
  for(const g of list){ g.dist=(loc&&isFinite(g.lat)&&isFinite(g.lon))?haversineKm(loc.lat,loc.lon,g.lat,g.lon):null; }
  // keep gauges that reported at least one value recently-ish
  list.sort((a,b)=>(a.dist??1e9)-(b.dist??1e9));
  return list;
}

async function fetchFavorites(){
  const list=favs();
  if(!list.length) return [];
  const results=await Promise.allSettled(list.map(async f=>{
    const url=`${BASE}/latest-continuous/items?monitoring_location_id=${encodeURIComponent(f.id)}&parameter_code=00060,00065&limit=10&f=json`;
    // v1 left favorites uncached; the per-favorite TTL cache is the policy-mandated
    // good-citizen change (API-AND-RELAY.md §2) — stale cache serves when offline,
    // and the card's own ">3 h old" amber marker keeps the age visible.
    const d=await Suite.fetchJSON(url,{cacheKey:"rivers.fav_"+f.id, ttl:TTL});
    const loc=getLoc();
    const g=groupGauges(d.v.features||[], {[f.id]:f.name}, loc)[0] || {id:f.id,name:titleCase(f.name),lat:f.lat,lon:f.lon,q:null,h:null,dist:loc&&isFinite(f.lat)?haversineKm(loc.lat,loc.lon,f.lat,f.lon):null};
    return g;
  }));
  return results.map((r,i)=> r.status==="fulfilled"?r.value:{id:list[i].id,name:titleCase(list[i].name),q:null,h:null,dist:null,offline:true});
}

/* ---------- render gauge card ---------- */
function isStale(iso){ if(!iso) return false; return (Date.now()-new Date(iso).getTime())>3*3600*1000; }
function fmtVal(x){ const n=parseFloat(x); if(!isFinite(n)) return x; return n>=1000?Math.round(n).toLocaleString():(n>=100?Math.round(n):n.toFixed(2).replace(/\.00$/,"")); }
function readTime(g){
  const t=(g.q&&g.q.time)||(g.h&&g.h.time);
  if(!t) return "";
  const d=new Date(t);
  return `Read ${d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}`;
}
function gaugeCard(g){
  const num=g.id.replace(/^USGS-/,"");
  const url=`https://waterdata.usgs.gov/monitoring-location/${num}/`;
  const stale=isStale((g.q&&g.q.time)||(g.h&&g.h.time));
  const q=g.q, h=g.h;
  const distTxt=g.dist!=null?`${g.dist.toFixed(g.dist<10?1:0)} km away`:"";
  const on=isFav(g.id);
  const disch = q&&q.v!=null
    ? `<div class="reading"><b>${esc(fmtVal(q.v))} <small>ft³/s</small></b><span>discharge</span></div>`
    : `<div class="reading none"><b>—</b><span>discharge</span></div>`;
  const height = h&&h.v!=null
    ? `<div class="reading"><b>${esc(fmtVal(h.v))} <small>ft</small></b><span>gauge height</span></div>`
    : `<div class="reading none"><b>—</b><span>gauge height</span></div>`;
  const timeTxt = g.offline?"favorite · couldn't refresh":readTime(g);
  return `<div class="gauge">
    <div class="g-top">
      <h3><a href="${esc(url)}" target="_blank" rel="noopener">${esc(g.name)}</a></h3>
      <button class="starbtn${on?" on":""}" data-id="${esc(g.id)}" title="${on?"Remove favorite":"Add favorite"}" aria-label="Toggle favorite" aria-pressed="${on?"true":"false"}">${on?"★":"☆"}</button>
    </div>
    <div class="g-sub">USGS ${esc(num)}${distTxt?" · "+esc(distTxt):""}</div>
    <div class="readings">${disch}${height}</div>
    <div class="g-time${stale?" stale":""}">${esc(timeTxt)}${stale&&!g.offline?" · stale":""}</div>
  </div>`;
}

function wireStars(container, refresh){
  container.querySelectorAll(".starbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id=btn.dataset.id;
      // find gauge data from current render caches
      const g=(lastNear.concat(lastFav)).find(x=>x.id===id) || {id,name:id,lat:null,lon:null};
      toggleFav(g);
      renderAll();
    });
  });
}

/* ---------- render orchestration ---------- */
let lastNear=[], lastFav=[], lastStamp=null, lastErr=null;

function renderStamp(){
  const el=document.getElementById("stamp"); if(!el) return;
  let s=lastStamp?`Data from ${new Date(lastStamp).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`:"";
  if(lastErr){ el.className="stamp err"; el.textContent=(s?s+" · ":"")+"connection issue: "+lastErr; }
  else { el.className="stamp"; el.textContent=s; }
}

function renderAll(){
  const favSec=document.getElementById("favSec"), nearSec=document.getElementById("nearSec");
  if(!favSec) return;
  renderStamp();
  // favorites
  const favList=favs();
  if(favList.length){
    const cards=lastFav.length?lastFav.map(gaugeCard).join(""):favList.map(f=>gaugeCard({id:f.id,name:titleCase(f.name),q:null,h:null,dist:null,offline:true})).join("");
    favSec.innerHTML=`<h2 class="sec">★ Favorites <span class="n">${favList.length}</span></h2><div class="grid" id="favGrid">${cards}</div>`;
  } else { favSec.innerHTML=""; }
  // nearby
  if(lastNear===null){
    nearSec.innerHTML=`<h2 class="sec">Nearby gauges</h2><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
  } else if(!lastNear.length){
    nearSec.innerHTML=`<h2 class="sec">Nearby gauges</h2><div class="msg"><div class="big">No active gauges nearby</div>
      No USGS stream gauges reported discharge or gauge height within about 60&nbsp;km. Try a location closer to a river.</div>`;
  } else {
    const cards=lastNear.slice(0,60).map(gaugeCard).join("");
    nearSec.innerHTML=`<h2 class="sec">Nearby gauges <span class="n">${lastNear.length} found</span></h2><div class="grid">${cards}</div>`;
  }
  wireStars(document, renderAll);
}

async function load(){
  const loc=getLoc(); if(!loc) return;
  lastNear=null; renderAll();
  // nearby (cached, v1 key; grouped result)
  const ck="near_"+loc.lat.toFixed(2)+"_"+loc.lon.toFixed(2);
  const cached=cacheGet(ck);
  if(cached){ lastNear=cached.v; lastStamp=cached.t; renderAll(); }
  if(cached && Date.now()-cached.t<TTL){
    // policy-mandated TTL (API-AND-RELAY.md §2): a cache fresher than 15 min is
    // served as-is instead of refetching (v1 refetched on every open)
    lastErr=null;
  } else {
    try{
      lastNear=await fetchNear(loc); lastStamp=Date.now(); lastErr=null;
      cacheSet(ck,lastNear);
    }catch(e){ lastErr=e.message||String(e); if(lastNear===null) lastNear=cached?cached.v:[]; }
  }
  renderAll();
  // favorites
  try{ lastFav=await fetchFavorites(); }catch(e){ /* keep prior */ }
  renderAll();
}

function boot(){
  if(!getLoc()){ renderSetup(); return; }
  renderShell();
  lastFav=[]; lastNear=null;
  load();
  clearInterval(refreshTimer);
  refreshTimer=setInterval(load, 15*60*1000);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && getLoc()) load(); });
boot();

/* First run: no location saved anywhere yet — ask the browser once and reload into
   the normal view. Inert when a location exists, when the user turned detection off
   in Settings, or when a previous request was refused (core: Suite.location). */
Suite.location.autoBoot();
</script>
</body>
</html>
