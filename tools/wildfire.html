<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wildfire Watchboard · Local Suite</title>
<link rel="stylesheet" href="../core/suite.css" data-suite-inline>
<style>
  /* tool accents: fire / containment (3-layer, same pattern as core).
     Phase 4 a11y: light --fire nudged #c94f2b -> #c74e2b (the bold acreage figure sat
     at 4.46:1, a hair under WCAG AA 4.5); --stale / --errsoft are theme-split status
     colors (single hexes failed AA in one theme). */
  :root{ --fire:#c74e2b; --fire-soft:#f3e2d8; --contain:#3a7d44; --stale:#986424; --errsoft:#b65b37; }
  @media (prefers-color-scheme:dark){
    :root{ --fire:#e07a54; --fire-soft:#2e2019; --contain:#7dc487; --stale:#c07f2d; --errsoft:#c6704e; }
  }
  :root[data-theme="light"]{ --fire:#c74e2b; --fire-soft:#f3e2d8; --contain:#3a7d44; --stale:#986424; --errsoft:#b65b37; }
  :root[data-theme="dark"]{ --fire:#e07a54; --fire-soft:#2e2019; --contain:#7dc487; --stale:#c07f2d; --errsoft:#c6704e; }

  body{padding:1.4rem 1.25rem 4rem;}
  .wrap{max-width:1060px;margin:0 auto}
  .topbar{display:flex;align-items:center;gap:.8rem;margin-bottom:1rem;flex-wrap:wrap}
  /* v1 wildfire uses the pill-style back link, not the core bare link */
  .back{font-size:.85rem;text-decoration:none;color:var(--muted);
    border:1px solid var(--line);background:var(--card);border-radius:999px;padding:.3rem .8rem;}
  .back:hover{color:var(--ink);text-decoration:none}
  .theme-btn{margin-left:auto;float:none}
  header h1{font-size:1.6rem;letter-spacing:-.02em}
  header .tag{color:var(--muted);margin-top:.25rem;font-size:.92rem}
  .locbar{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin:1rem 0 .2rem;font-size:.9rem;color:var(--muted)}
  .locbar b{color:var(--ink);font-weight:600}
  .linkbtn{background:none;border:none;color:var(--accent);cursor:pointer;font-size:.85rem;padding:0;text-decoration:underline}
  .controls{display:flex;gap:1rem;flex-wrap:wrap;align-items:flex-end;margin:1rem 0}
  .ctl{display:flex;flex-direction:column;gap:.3rem}
  .ctl label{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
  .ctl .val{color:var(--accent);font-weight:600}
  select{padding:.4rem .6rem;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:.9rem}
  input[type=range]{width:170px;accent-color:var(--accent)}
  .stats{display:flex;gap:1.6rem;flex-wrap:wrap;margin:.2rem 0 1rem}
  .stat b{font-size:1.5rem;display:block;line-height:1.15;color:var(--fire)}
  .stat span{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
  .list{display:flex;flex-direction:column;gap:.6rem}
  .fire{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--fire);
    border-radius:12px;padding:.85rem 1rem;box-shadow:var(--shadow);
    display:grid;grid-template-columns:1fr auto;gap:.6rem 1rem;align-items:start}
  .fire h3{font-size:1.02rem;font-weight:600}
  .fire .sub{font-size:.78rem;color:var(--muted);margin-top:.15rem}
  .fire .facts{display:flex;gap:1.4rem;margin-top:.55rem;flex-wrap:wrap}
  .fact b{font-size:1.15rem;display:block;line-height:1.1}
  .fact span{font-size:.66rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
  .fact .acres{color:var(--fire)}
  .contain-wrap{margin-top:.5rem;max-width:340px}
  .contain-bar{height:7px;border-radius:5px;background:var(--chip);overflow:hidden}
  .contain-bar>div{height:100%;background:var(--contain);border-radius:5px}
  .contain-lbl{font-size:.7rem;color:var(--muted);margin-top:.2rem}
  .fire .dist{text-align:right;white-space:nowrap}
  .fire .dist b{font-size:1.35rem;color:var(--ink);display:block;line-height:1.1}
  .fire .dist span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .badge-rx{display:inline-block;font-size:.62rem;font-weight:700;color:var(--muted);border:1px solid var(--line);
    border-radius:6px;padding:0 .35rem;margin-left:.4rem;vertical-align:1px;letter-spacing:.03em;text-transform:uppercase}
  .msg{padding:2.4rem 1rem;text-align:center;color:var(--muted);
    background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
  .msg .big{font-size:1.15rem;color:var(--ink);margin-bottom:.4rem}
  .msg.calm .big{color:var(--contain)}
  .stamp{font-size:.78rem;color:var(--muted);margin:.7rem 0}
  .stamp.err{color:var(--stale)}
  footer{margin-top:2.6rem;font-size:.82rem;padding-top:1rem}
  .setup{max-width:440px;margin:2rem auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:1.2rem;box-shadow:var(--shadow)}
  .setup h2{font-size:1.2rem;margin-bottom:.3rem}
  .setup p{color:var(--muted);font-size:.9rem;margin-bottom:1rem}
  .setup .row{display:flex;gap:.5rem;margin-bottom:.7rem}
  .setup input{flex:1}
  input[type=text]{padding:.5rem .65rem;border:1px solid var(--line);border-radius:9px;background:var(--card);color:var(--ink);font-size:.95rem}
  .btn{border:none;border-radius:9px;padding:.55rem .9rem;cursor:pointer;font-size:.9rem;font-weight:600}
  .btn.primary{background:var(--accent);color:var(--bg)}
  .btn.ghost{background:var(--card);border:1px solid var(--line);color:var(--ink)}
  .err-inline{color:var(--errsoft);font-size:.82rem;min-height:1.1rem}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a class="back" href="index.html">← suite</a>
    <button class="theme-btn" id="themeBtn" title="Toggle light/dark">◐ theme</button>
  </div>
  <header>
    <h1>🔥 Wildfire Watchboard</h1>
    <p class="tag">Active wildfire incidents near you: size, containment, and distance.</p>
  </header>

  <div id="app"></div>

  <footer>
    Data: NIFC / WFIGS Interagency Incident Locations (current) · ArcGIS feature service.
    Refreshes about every 30 minutes; cached locally between visits.
  </footer>
</div>

<script src="../core/suite.js" data-suite-inline></script>
<script>
"use strict";

Suite.theme.init();
Suite.location.watch();

/* ---------- shared suite helpers ---------- */
const esc=Suite.esc;
function getLoc(){ return Suite.location.get(); }
function setLoc(l){ Suite.location.set(l); }
function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,r=Math.PI/180;
  const dLa=(lat2-lat1)*r, dLo=(lon2-lon1)*r;
  const s=Math.sin(dLa/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}

/* ---------- WFIGS endpoint ---------- */
const WFIGS="https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Incident_Locations_Current/FeatureServer/0/query";
const FIELDS="IncidentName,IncidentShortDescription,IncidentTypeCategory,IncidentSize,PercentContained,FireDiscoveryDateTime,POOState,IrwinID";
const TTL=30*60*1000; // manifest cacheTtlMin: 30 — the good-citizen refresh interval

const state={ radius: parseFloat(Suite.store.get("suite.wildfire.radius","250")),
  sort: Suite.store.get("suite.wildfire.sort")||"dist",
  fires:null, stamp:null, error:null };
let refreshTimer=null;
const appEl=document.getElementById("app");

/* ---------- first-run location ---------- */
function renderSetup(){
  clearInterval(refreshTimer);
  appEl.innerHTML=`
    <div class="setup">
      <h2>Set your location</h2>
      <p>The board ranks active fires by distance from you. Enter a US ZIP, or use your device location.
         This is saved for the whole suite.</p>
      <div class="row">
        <input type="text" id="zip" inputmode="numeric" placeholder="US ZIP e.g. 95403" maxlength="5" aria-label="US ZIP code">
        <button class="btn primary" id="zipBtn">Set</button>
      </div>
      <div class="row"><button class="btn ghost" id="geoBtn" style="flex:1">Use my location</button></div>
      <div class="err-inline" id="setupErr"></div>
    </div>`;
  const zip=document.getElementById("zip");
  const err=Suite.liveRegion(document.getElementById("setupErr"));
  document.getElementById("zipBtn").addEventListener("click", async()=>{
    const z=zip.value.trim(); err.textContent="";
    if(!/^\d{5}$/.test(z)){ err.textContent="Enter a 5-digit ZIP."; return; }
    try{
      const d=(await Suite.fetchJSON(`https://api.zippopotam.us/us/${z}`)).v;
      const p=d.places[0];
      setLoc({lat:parseFloat(p.latitude),lon:parseFloat(p.longitude),label:`${p["place name"]}, ${p["state abbreviation"]}`});
      boot();
    }catch(e){ err.textContent="Couldn't find that ZIP. Try another."; }
  });
  zip.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("zipBtn").click(); });
  document.getElementById("geoBtn").addEventListener("click", ()=>{
    if(!navigator.geolocation){ err.textContent="Geolocation isn't available here."; return; }
    err.textContent="Locating…";
    navigator.geolocation.getCurrentPosition(
      pos=>{ setLoc({lat:+pos.coords.latitude.toFixed(4),lon:+pos.coords.longitude.toFixed(4),label:"My location"}); boot(); },
      e=>{ err.textContent="Location denied. Try a ZIP instead (may need http://)."; });
  });
}

/* ---------- shell ---------- */
function renderShell(){
  const loc=getLoc();
  appEl.innerHTML=`
    <div class="locbar"><span>Near <b id="locLabel"></b></span><button class="linkbtn" id="changeLoc">change</button></div>
    <div class="controls">
      <div class="ctl">
        <label for="rad">Within · <span class="val" id="radVal"></span></label>
        <input type="range" id="rad" min="50" max="800" step="25" value="${state.radius}">
      </div>
      <div class="ctl">
        <label for="sortSel">Sort by</label>
        <select id="sortSel">
          <option value="dist"${state.sort==="dist"?" selected":""}>Nearest first</option>
          <option value="size"${state.sort==="size"?" selected":""}>Largest first</option>
          <option value="new"${state.sort==="new"?" selected":""}>Newest first</option>
        </select>
      </div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="stamp" class="stamp"></div>
    <div class="list" id="list"></div>`;
  document.getElementById("locLabel").textContent=loc.label;
  document.getElementById("changeLoc").addEventListener("click", renderSetup);
  document.getElementById("radVal").textContent=state.radius+" km";
  Suite.liveRegion(document.getElementById("stats"));
  Suite.liveRegion(document.getElementById("stamp"));
  const rad=document.getElementById("rad");
  rad.addEventListener("input", ()=>{ state.radius=parseFloat(rad.value); Suite.store.set("suite.wildfire.radius",state.radius);
    document.getElementById("radVal").textContent=state.radius+" km"; renderData(); });
  const sortSel=document.getElementById("sortSel");
  sortSel.addEventListener("change", ()=>{ state.sort=sortSel.value; Suite.store.set("suite.wildfire.sort",state.sort); renderData(); });
}

/* ---------- load ---------- */
/* V3 scopes the raw WFIGS GeoJSON envelope by normalized coordinates. The legacy
   unscoped cache is intentionally ignored because its bounding box is unknowable. */
function mapFires(v,loc){
  if(Array.isArray(v)){ // v1-era cache: mapped fire objects — recompute distance
    return v.map(f=>({ ...f, dist:(isFinite(f.lat)&&isFinite(f.lon))?haversineKm(loc.lat,loc.lon,f.lat,f.lon):null }));
  }
  return (v&&v.features||[]).map(f=>{
    const p=f.properties||{}, g=f.geometry&&f.geometry.coordinates||[];
    const lon=g[0], lat=g[1];
    return {
      name:p.IncidentName, type:p.IncidentTypeCategory, size:p.IncidentSize,
      contained:p.PercentContained, discovered:p.FireDiscoveryDateTime,
      state:p.POOState, desc:p.IncidentShortDescription, irwin:p.IrwinID,
      lat,lon, dist:(isFinite(lat)&&isFinite(lon))?haversineKm(loc.lat,loc.lon,lat,lon):null
    };
  });
}
function fireCacheKey(loc){
  return "wildfire." + loc.lat.toFixed(3) + "_" + loc.lon.toFixed(3);
}

async function load(){
  const loc=getLoc(); if(!loc) return;
  const cacheKey=fireCacheKey(loc);
  // instant paint from the cache envelope while the (possible) network fetch runs — v1 behavior
  const cached=Suite.store.get("suite.cache."+cacheKey);
  if(cached && typeof cached==="object" && "v" in cached){
    state.fires=mapFires(cached.v,loc); state.stamp=cached.t; state.error=null; renderData();
  }
  try{
    // Pull active incidents in a generous bounding box around the user (envelope filter server-side).
    const dLat=8, dLon=8/Math.max(0.3,Math.cos(loc.lat*Math.PI/180));
    const geom=`${(loc.lon-dLon).toFixed(3)},${(loc.lat-dLat).toFixed(3)},${(loc.lon+dLon).toFixed(3)},${(loc.lat+dLat).toFixed(3)}`;
    const url=`${WFIGS}?where=1%3D1&outFields=${encodeURIComponent(FIELDS)}&geometry=${encodeURIComponent(geom)}`+
      `&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outSR=4326&f=geojson&resultRecordCount=1000`;
    const r=await Suite.fetchJSON(url,{cacheKey, ttl:TTL});
    state.fires=mapFires(r.v,loc); state.stamp=r.t;
    state.error=r.stale ? "offline — showing cached data" : null;
    renderData();
  }catch(e){
    state.error=e.message||String(e);
    if(!state.fires) renderData(); else renderStamp();
  }
}

/* ---------- render ---------- */
function renderStamp(){
  const el=document.getElementById("stamp"); if(!el) return;
  let s=state.stamp?`Data from ${new Date(state.stamp).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`:"";
  if(state.error){ el.className="stamp err"; el.textContent=(s?s+" · ":"")+"connection issue: "+state.error; }
  else{ el.className="stamp"; el.textContent=s; }
}
function isRx(f){ return /\bRX\b|prescribed/i.test((f.name||"")+" "+(f.type||"")); }
function fmtDate(ms){ if(!ms) return "unknown"; const d=new Date(ms); return d.toLocaleDateString([], {month:"short",day:"numeric",year:"numeric"}); }

function renderData(){
  const listEl=document.getElementById("list"); if(!listEl) return;
  renderStamp();
  if(!state.fires){
    listEl.innerHTML=`<div class="msg"><div class="big">Couldn't reach WFIGS</div>
      No cached fire data yet. Check your connection; the board retries automatically.</div>`;
    document.getElementById("stats").innerHTML=""; return;
  }
  let fires=state.fires.filter(f=>f.dist!=null && f.dist<=state.radius);
  // sort
  if(state.sort==="dist") fires.sort((a,b)=>a.dist-b.dist);
  else if(state.sort==="size") fires.sort((a,b)=>(b.size||0)-(a.size||0));
  else fires.sort((a,b)=>(b.discovered||0)-(a.discovered||0));

  const totalAcres=fires.reduce((s,f)=>s+(f.size||0),0);
  const nearest=fires.length?fires.reduce((m,f)=>f.dist<m?f.dist:m,Infinity):null;
  document.getElementById("stats").innerHTML=`
    <div class="stat"><b>${fires.length}</b><span>within ${state.radius} km</span></div>
    <div class="stat"><b>${totalAcres>=1000?Math.round(totalAcres).toLocaleString():Math.round(totalAcres)}</b><span>total acres</span></div>
    <div class="stat"><b>${nearest!=null&&isFinite(nearest)?Math.round(nearest)+" km":"—"}</b><span>nearest</span></div>`;

  if(!fires.length){
    listEl.innerHTML=`<div class="msg calm"><div class="big">No active fires within ${state.radius} km</div>
      Nothing on the WFIGS incident feed near you right now. Widen the radius to scan farther out.</div>`;
    return;
  }
  listEl.innerHTML=fires.map(fireCard).join("");
}

function fireCard(f){
  const acres=f.size!=null?(f.size>=10?Math.round(f.size).toLocaleString():f.size.toFixed(1)):"—";
  const pct=(f.contained!=null&&isFinite(f.contained))?Math.max(0,Math.min(100,f.contained)):null;
  const name=esc(f.name||"Unnamed incident")+(isRx(f)?`<span class="badge-rx">Rx burn</span>`:"");
  const sub=[f.state?esc(f.state.replace(/^US-/,"")):"", f.type?esc(f.type):"", "discovered "+fmtDate(f.discovered)].filter(Boolean).join(" · ");
  const contain = pct!=null
    ? `<div class="contain-wrap"><div class="contain-bar"><div style="width:${pct}%"></div></div>
        <div class="contain-lbl">${pct}% contained</div></div>`
    : `<div class="contain-wrap"><div class="contain-lbl">Containment not reported</div></div>`;
  return `<div class="fire">
    <div>
      <h3>${name}</h3>
      <div class="sub">${sub}</div>
      <div class="facts">
        <div class="fact"><b class="acres">${acres}</b><span>acres</span></div>
        <div class="fact"><b>${pct!=null?pct+"%":"—"}</b><span>contained</span></div>
      </div>
      ${contain}
    </div>
    <div class="dist"><b>${Math.round(f.dist)}</b><span>km away</span></div>
  </div>`;
}

function boot(){
  if(!getLoc()){ renderSetup(); return; }
  renderShell();
  load();
  clearInterval(refreshTimer);
  refreshTimer=setInterval(load, 15*60*1000);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && getLoc()) load(); });
boot();

/* First run: no location saved anywhere yet — ask the browser once and reload into
   the normal view. Inert when a location exists, when the user turned detection off
   in Settings, or when a previous request was refused (core: Suite.location). */
Suite.location.autoBoot();
</script>
</body>
</html>
