   The suite has always shared one location; what it never did was acquire the
   first one for you, so every tool cold-started into a "type a ZIP" card. This
   asks the browser once — no network request, so it works under every tool's
   generated CSP and from file:// — and hands the result to loc.set(), which is
   the same path the manual buttons already use. Off switch: suite.location.auto.
   A refusal is remembered so the prompt never appears twice. */
const AUTO_KEY = "suite.location.auto";
const AUTO_DENIED_KEY = "suite.location.autoDenied";
const GEO_TIMEOUT_MS = 10000;

Object.assign(loc, {
  autoEnabled() { return store.get(AUTO_KEY) !== "off"; },   /* absent = on */
  /* sentinel is non-numeric on purpose: store.get JSON-parses first, so "1"
     would come back as the number 1 and never match a string compare */
  autoDenied() { return store.get(AUTO_DENIED_KEY) === "denied"; },
  setAuto(on) {
    /* turning it back on is also how you take back a "Block" — otherwise a
       single misclick would be unrecoverable without the storage viewer */
    if (on) { store.remove(AUTO_DENIED_KEY); return store.remove(AUTO_KEY); }
    return store.set(AUTO_KEY, "off");
  },
  /* true when asking could actually get somewhere — used to stay silent rather
     than paint a "finding you…" state that can never resolve */
  autoPossible() {
    return !loc.get() && loc.autoEnabled() && !loc.autoDenied() &&
      typeof navigator !== "undefined" && !!navigator.geolocation;
  },
  auto() {
    const have = loc.get();
    if (have) return Promise.resolve(have);
    if (!loc.autoPossible()) return Promise.resolve(null);
    return new Promise(resolve => {
      let settled = false;
      const done = v => { if (!settled) { settled = true; resolve(v); } };
      try {
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = +pos.coords.latitude.toFixed(4);
            const lon = +pos.coords.longitude.toFixed(4);
            try {
              loc.set({ lat, lon, label: "My location (" + lat + ", " + lon + ")" });
            } catch (e) { return done(null); }
            /* resolve only on a write that actually stuck: a failed write (storage
               full, denied, private mode) must not report success, or autoBoot
               would reload into the same empty page forever */
            done(loc.get());
          },
          err => {
            if (!err || err.code !== 1) return done(null);   // 1 = PERMISSION_DENIED
            /* Remember only a refusal someone actually made. Automation, headless
               runs and enterprise policy all report the same code 1 while the
               permission state is still "prompt" — persisting that would switch
               the feature off for good for a user who was never asked. When the
               Permissions API can't say (older Safari rejects for geolocation),
               treat it as a real refusal: re-prompting on every load is worse. */
            let q = null;
            try {
              q = navigator.permissions && navigator.permissions.query({ name: "geolocation" });
            } catch (e) { q = null; }
            if (!q || typeof q.then !== "function") {
              store.set(AUTO_DENIED_KEY, "denied");
              return done(null);
            }
            q.then(
              s => { if (!s || s.state !== "prompt") store.set(AUTO_DENIED_KEY, "denied"); },
              () => { store.set(AUTO_DENIED_KEY, "denied"); }
            ).then(() => done(null), () => done(null));
          },
          { timeout: GEO_TIMEOUT_MS, maximumAge: 600000 }
        );
      } catch (e) { done(null); }
    });
  },
  /* Drop-in for a tool's boot: does nothing at all unless this is a genuine cold
     start, then reloads once the location lands. Reload rather than re-render
     because tools read the location in a dozen different shapes — several cache
     it at parse time — and on a cold start there is nothing on screen to lose:
     the page is showing its empty "set your location" card. Same move those
     tools already make on the cross-tab storage event.

     But not every tool blocks on a location — geo, elevation, recalls and the
     station pickers are usable straight away — so anything the user has typed
     cancels the reload. The location is saved and shared either way; only the
     free re-render is given up, and the next visit opens on it. */
  autoBoot() {
    if (!loc.autoPossible()) return Promise.resolve(null);
    let typed = false;
    const mark = () => { typed = true; };
    const watch = typeof document !== "undefined" && document.addEventListener;
    if (watch) {
      document.addEventListener("input", mark, true);
      document.addEventListener("change", mark, true);
    }
    const unwatch = () => {
      if (!watch) return;
      document.removeEventListener("input", mark, true);
      document.removeEventListener("change", mark, true);
    };
    return loc.auto().then(l => {
      unwatch();
      if (l && !typed && typeof window !== "undefined") window.location.reload();
      return l;
    }, () => { unwatch(); return null; });
  }
});

const locations = {
  /* Migration is explicit: only v3 entry points (hub/settings) call init().
     Older tools that merely read suite.location do not gain a surprise key. */
  init() {
    let c = readLocations();
    if (c && (c.unsupported || c.invalid)) return c;
    if (c && c.items.length) {
      const item = activeItem(c);
      if (item) mirrorLocation(item);
      return c;
    }
    if (c) store.remove(LOCATIONS_KEY);
    const legacy = loc.get();
    if (!legacy) return { schema: LOCATIONS_SCHEMA, activeId: null, items: [] };
    const item = Object.assign({ id: "saved-location", revision: 1 }, legacy);
    item.label = legacy.label;
    c = { schema: LOCATIONS_SCHEMA, activeId: item.id, items: [item] };
    writeLocations(c);
    return c;
  },
  all() { return locations.init().items.map(x => Object.assign({}, x)); },
  active() {
    const c = locations.init();
    if (c.unsupported || c.invalid) {
      const legacy = loc.get();
      return legacy ? Object.assign({ id: null, storageIssue: c.unsupported ? "newer" : "invalid" }, legacy) : null;
    }
    const item = activeItem(c);
    return item ? Object.assign({}, item) : null;
  },
  add(l) {
    if (!validLocation(l)) throw new Error("Suite.locations.add needs valid {lat, lon}");
    const c = requireSupported(locations.init());
    const label = String(l.label || "").trim() || "Saved location";
    const item = Object.assign({ id: uniqueId(c, label), label, revision: 1 }, cleanLocation(l));
    item.label = label;
    c.items.push(item);
    const becomesActive = !c.activeId;
    if (becomesActive) c.activeId = item.id;
    const collectionSaved = writeLocations(c);
    const mirrored = collectionSaved && (!becomesActive || mirrorLocation(item));
    let purged = 0;
    if (becomesActive && mirrored) purged = resetLocationState();
    return { location: Object.assign({}, item), purged, saved: !!mirrored };
  },
  update(id, changes) {
    const c = requireSupported(locations.init());
    const item = c.items.find(x => x.id === id);
    if (!item) throw new Error("Unknown saved location: " + id);
    const candidate = {
      lat: changes && changes.lat !== undefined ? changes.lat : item.lat,
      lon: changes && changes.lon !== undefined ? changes.lon : item.lon,
      label: changes && changes.label !== undefined ? changes.label : item.label
    };
    if (!validLocation(candidate)) throw new Error("Suite.locations.update needs valid coordinates");
    const moved = item.lat !== +candidate.lat || item.lon !== +candidate.lon;
    item.lat = +candidate.lat; item.lon = +candidate.lon;
    item.label = String(candidate.label || "").trim() || item.label || "Saved location";
    if (moved) item.revision++;
    const collectionSaved = writeLocations(c);
    let mirrored = collectionSaved;
    let purged = 0;
    if (collectionSaved && c.activeId === id) {
      mirrored = mirrorLocation(item);
      if (moved && mirrored) purged = resetLocationState();
    }
    return { location: Object.assign({}, item), purged, saved: !!mirrored };
  },
  activate(id) {
    const c = requireSupported(locations.init());
    const item = c.items.find(x => x.id === id);
    if (!item) throw new Error("Unknown saved location: " + id);
    const changed = c.activeId !== id;
    c.activeId = id;
    const saved = writeLocations(c);
    const mirrored = saved && mirrorLocation(item);
    return { location: Object.assign({}, item),
      purged: changed && mirrored ? resetLocationState() : 0, saved: !!mirrored };
  },
  remove(id) {
    const c = requireSupported(locations.init());
    const i = c.items.findIndex(x => x.id === id);
    if (i < 0) return { removed: false, active: locations.active(), purged: 0 };
    const wasActive = c.activeId === id;
    c.items.splice(i, 1);
    if (wasActive) c.activeId = c.items[0] ? c.items[0].id : null;
    const saved = c.items.length ? writeLocations(c) : store.remove(LOCATIONS_KEY);
    const next = activeItem(c);
    const mirrored = !wasActive || (saved && mirrorLocation(next));
    return { removed: true, active: next ? Object.assign({}, next) : null,
      purged: wasActive && mirrored ? resetLocationState() : 0, saved: !!(saved && mirrored) };
  }
};

/* ---- API keys: the suite.key.<name> convention (API-AND-RELAY.md §3) ----
   Officially published demo/public keys only — never a personal key. */
const DEMO_KEYS = {
  nasa: "DEMO_KEY",              // api.nasa.gov demo tier: 30/hr, 50/day
  usda: "DEMO_KEY",              // USDA FoodData Central demo tier
  bart: "MW9S-E7SL-26DU-VV8V"    // BART's officially published public key
};
function key(name) {
  const v = store.get("suite.key." + name);
  if (typeof v === "string" && v.trim()) return { value: v.trim(), isDemo: false };
  if (DEMO_KEYS[name]) return { value: DEMO_KEYS[name], isDemo: true };
  return { value: null, isDemo: false };
}

/* ---- favorites & recently used: suite-wide quick access (v4) ----
   suite.hub.favorites is an array of tool ids; suite.hub.recents is
   [{id, t}] newest-first, bounded. The per-tool chrome star is injected next
   to the theme button by theme.init() — every built page already calls it, so
   no tool needed new markup. The hub renders its own card stars plus the
   Favorites and Recently used sections; it is excluded here (and Settings is
   excluded from recents) so "recently used" stays about actual tools. */
const FAV_KEY = "suite.hub.favorites";
const RECENTS_KEY = "suite.hub.recents";
const RECENTS_MAX = 10;

function toolId() {
  try {
    const file = decodeURIComponent((location.pathname.split("/").pop() || ""));
    const m = file.match(/^([a-z][a-z0-9-]*)\.html$/);
    if (m) return m[1];
    /* a hosted scope root ("…/local-suite-4/") serves the hub */
    return /\/$/.test(location.pathname) ? "index" : null;
  } catch (e) { return null; }
}

const favorites = {
  all() {
    const v = store.get(FAV_KEY);
    return Array.isArray(v) ? v.filter(x => typeof x === "string" && x) : [];
  },
  has(id) { return favorites.all().includes(id); },
  /* returns the new state; a write that does not stick reports the old one */
  toggle(id) {
    if (typeof id !== "string" || !id) return false;
    const cur = favorites.all();
    const next = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat(id);
    return store.set(FAV_KEY, next) ? next.includes(id) : cur.includes(id);
  }
};

const recents = {
  all() {
    const v = store.get(RECENTS_KEY);
    if (!Array.isArray(v)) return [];
    return v.filter(x => x && typeof x === "object" &&
      typeof x.id === "string" && x.id && isFinite(x.t)).slice(0, RECENTS_MAX);
  },
  record(id) {
    if (typeof id !== "string" || !id || id === "index" || id === "settings") return false;
    const next = [{ id, t: Date.now() }]
      .concat(recents.all().filter(x => x.id !== id)).slice(0, RECENTS_MAX);
    return store.set(RECENTS_KEY, next);
  },
  clear() { return store.remove(RECENTS_KEY); }
};

function paintFavButtons() {
  document.querySelectorAll(".fav-btn[data-tool]").forEach(btn => {
    const on = favorites.has(btn.dataset.tool);
    btn.setAttribute("aria-pressed", String(on));
    btn.classList.toggle("on", on);
    btn.textContent = on ? "★" : "☆";
  });
}

/* Runs once from theme.init() on every page except the hub: notes the visit in
   recents and adds the chrome star beside the theme button. */
function initToolChrome() {
  const id = toolId();
  if (!id || id === "index") return;
  recents.record(id);
  const anchor = document.querySelector("#themeBtn, .theme-btn");
  if (!anchor || document.querySelector(".fav-btn")) return;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "fav-btn";
  btn.dataset.tool = id;
  btn.title = "Favorite this tool";
  btn.setAttribute("aria-label", "Favorite this tool — favorites appear first on the suite hub");
  btn.addEventListener("click", () => { favorites.toggle(id); paintFavButtons(); });
  anchor.insertAdjacentElement("afterend", btn);
  paintFavButtons();
  window.addEventListener("storage", e => { if (e.key === FAV_KEY) paintFavButtons(); });
}

/* ---- optional power-user relay (API-AND-RELAY.md §6) ----
   Unset for everyone by default: tools use their link-out/embedded paths. */
function relay(url) {
  const base = store.get("suite.relay.url");
  if (typeof base !== "string" || !base.trim()) return null;
  const b = base.trim().replace(/\/$/, "");
  return b + (b.includes("?") ? "&" : "?") + "url=" + encodeURIComponent(url);
}

window.Suite = { theme, fetchJSON, store, esc, liveRegion, location: loc, locations,
  favorites, recents, key, relay };

/* ---- PWA registration (PWA.md §1) — inert from file://, forever ----
   The .catch keeps a failed registration from ever costing console noise on a
   page that works perfectly well without the service worker. */
if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
<script>
"use strict";

Suite.theme.init();

/* ---------- location ---------- */
function getLocation() { return Suite.location.get(); }
function saveLocation(loc) { Suite.location.set(loc); }

const $ = s => document.querySelector(s);
const mainEl = Suite.liveRegion($("#main"));
const locLabelEl = $("#locLabel");
const updatedEl = Suite.liveRegion($("#updated"));
const esc = Suite.esc;

/* v1 cached one derived-model blob at suite.cache.spaceweather ({t, v: model}) and used
   it for the optimistic first paint and the offline fallback. v2 keeps that blob (a v1
   user's cache still renders) and ADDS policy-mandated per-endpoint TTL caching via
   Suite.fetchJSON (API-AND-RELAY.md §2) under suite.cache.spaceweather.<key>. */
const CACHE = "suite.cache.spaceweather";
const TTL = 10 * 60 * 1000; // manifest cacheTtlMin: 10 — weather-class source, matches v1's 10-min refresh timer

function getSW(key, url) {
  return Suite.fetchJSON(url, { cacheKey: "spaceweather." + key, ttl: TTL });
}

function relTime(ms) {
  const s = Math.round((Date.now() - ms) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s/60) + " min ago";
  if (s < 86400) return Math.floor(s/3600) + " hr ago";
  return new Date(ms).toLocaleString([], { month:"short", day:"numeric", hour:"numeric" });
}

/* ---------- Kp model ---------- */
function kpColor(kp) {
  if (kp < 4) return "var(--quiet)";
  if (kp < 5) return "var(--unsettled)";
  if (kp < 6) return "var(--minor)";
  if (kp < 8) return "var(--storm)";
  return "var(--severe)";
}
function gLevel(kp) {
  // NOAA G-scale from Kp
  if (kp < 5) return { g: 0, label: kp < 4 ? "Quiet / unsettled" : "Active" };
  const g = Math.min(5, Math.floor(kp) - 4);
  const names = { 1: "G1 · Minor storm", 2: "G2 · Moderate storm", 3: "G3 · Strong storm", 4: "G4 · Severe storm", 5: "G5 · Extreme storm" };
  return { g, label: names[g] };
}
// Approx equatorward viewing latitude (deg) by Kp — aurora may be visible at/above this latitude.
const KP_LAT = { 0: 66.5, 1: 64.5, 2: 62.5, 3: 60.5, 4: 58.5, 5: 56.5, 6: 54.5, 7: 52.5, 8: 50.5, 9: 48.5 };
function auroraVerdict(kp, lat) {
  const alat = Math.abs(lat);
  const kpFloor = Math.max(0, Math.min(9, Math.floor(kp)));
  const nowThreshold = KP_LAT[kpFloor];
  const visible = alat >= nowThreshold;
  // find minimum Kp that would bring the oval to this latitude
  let needed = null;
  for (let k = 0; k <= 9; k++) { if (alat >= KP_LAT[k]) { needed = k; break; } }
  if (visible) {
    return { emoji: "🌌", verdict: "Aurora may be visible tonight",
      sub: `Kp ${kp.toFixed(1)} reaches your latitude (${alat.toFixed(1)}°). Find a dark spot with a clear view to the ${lat >= 0 ? "north" : "south"}.` };
  }
  if (needed == null) {
    return { emoji: "🌙", verdict: "Aurora very unlikely here",
      sub: `At ${alat.toFixed(1)}° you're too far from the poles for a typical storm to bring the aurora overhead.` };
  }
  return { emoji: "🌠", verdict: "No aurora expected right now",
    sub: `Current Kp ${kp.toFixed(1)}. You'd need about Kp ${needed}+ for a chance at your latitude (${alat.toFixed(1)}°).` };
}

/* ---------- gauge SVG ---------- */
function kpGauge(kp) {
  const r = 62, cx = 74, cy = 74, w = 12;
  const frac = Math.max(0, Math.min(1, kp / 9));
  // semicircle from 180deg (left) to 0deg (right), sweeping over the top
  const ang = Math.PI - frac * Math.PI;
  const px = cx + r * Math.cos(ang), py = cy - r * Math.sin(ang);
  const startX = cx - r, startY = cy;
  const large = frac > 0.5 ? 1 : 0;
  const track = `M ${startX} ${startY} A ${r} ${r} 0 1 1 ${cx + r} ${cy}`;
  const fill = `M ${startX} ${startY} A ${r} ${r} 0 ${large} 1 ${px} ${py}`;
  return `<svg class="gauge" width="148" height="90" viewBox="0 0 148 90" aria-hidden="true">
    <path d="${track}" fill="none" stroke="var(--line)" stroke-width="${w}" stroke-linecap="round"/>
    <path d="${fill}" fill="none" stroke="${kpColor(kp)}" stroke-width="${w}" stroke-linecap="round"/>
    <circle cx="${px}" cy="${py}" r="6" fill="${kpColor(kp)}" stroke="var(--card)" stroke-width="2"/>
  </svg>`;
}

/* ---------- sparkline ---------- */
function sparkline(values) {
  if (!values.length) return "";
  const w = 260, h = 40, pad = 2;
  const max = 9, min = 0;
  const step = (w - pad * 2) / (values.length - 1 || 1);
  const pts = values.map((v, i) => {
    const x = pad + i * step;
    const y = h - pad - ((v - min) / (max - min)) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(" ");
  const last = values[values.length - 1];
  const lx = pad + (values.length - 1) * step;
  const ly = h - pad - ((last - min) / (max - min)) * (h - pad * 2);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <line x1="0" y1="${(h - pad - (5/9)*(h-pad*2)).toFixed(1)}" x2="${w}" y2="${(h - pad - (5/9)*(h-pad*2)).toFixed(1)}" stroke="var(--line)" stroke-dasharray="3 3"/>
    <polyline points="${pts}" fill="none" stroke="var(--accent)" stroke-width="1.8"/>
    <circle cx="${lx.toFixed(1)}" cy="${ly.toFixed(1)}" r="3" fill="${kpColor(last)}"/>
  </svg>`;
}

/* ---------- render ---------- */
function skeleton() {
  mainEl.innerHTML =
    `<div class="grid">
      <div class="panel aurora"><div class="skel" style="height:70px;width:100%"></div></div>
      <div class="panel"><div class="p-label">Planetary K-index</div><div class="skel" style="height:120px"></div></div>
      <div class="panel"><div class="p-label">Solar wind</div><div class="skel" style="height:120px"></div></div>
    </div>`;
}

function render(model, stampMs) {
  updatedEl.textContent = stampMs ? "updated " + relTime(stampMs) : "";
  const loc = getLocation();
  const kp = model.kp;
  const gl = gLevel(kp);
  const av = auroraVerdict(kp, loc.lat);
  const scales = model.scales || {};

  const scaleCell = (letter, name, obj) => {
    const lv = obj && obj.Scale != null ? obj.Scale : "0";
    const tx = obj && obj.Text ? obj.Text : "none";
    const cols = { "0": "var(--quiet)", "1": "var(--unsettled)", "2": "var(--minor)", "3": "var(--storm)", "4": "var(--severe)", "5": "var(--severe)" };
    const col = cols[lv] || "var(--muted)";
    return `<div class="sc"><div class="lv" style="color:${col}">${esc(letter)}${esc(lv)}</div>
      <div class="nm">${esc(name)}</div><div class="tx">${esc(tx)}</div></div>`;
  };

  const wind = model.wind || {};
  const num = (v, d = 0) => (v == null ? "—" : (d ? (+v).toFixed(d) : Math.round(v)));

  mainEl.innerHTML =
    `<div class="grid">
      <div class="panel aurora" style="border-color:${av.verdict.startsWith("Aurora may") ? kpColor(kp) : "var(--line)"}">
        <div class="emoji" aria-hidden="true">${av.emoji}</div>
        <div><div class="verdict">${esc(av.verdict)}</div><div class="sub">${esc(av.sub)}</div></div>
      </div>

      <div class="panel">
        <div class="p-label">Planetary K-index</div>
        <div class="gauge-wrap">
          ${kpGauge(kp)}
          <div class="gauge-read">
            <div class="kp" style="color:${kpColor(kp)}">${esc(kp.toFixed(2))}<small> / 9 Kp</small></div>
            <div class="glabel" style="color:${kpColor(kp)}">${esc(gl.label)}</div>
            <div class="gwhen">as of ${esc(model.kpWhen || "recent")}</div>
          </div>
        </div>
        <div class="spark">
          <div class="sl">Last ${esc(model.kpHistory.length)} readings (3-day) · dashed line = storm threshold Kp5</div>
          ${sparkline(model.kpHistory)}
        </div>
      </div>

      <div class="panel">
        <div class="p-label">Solar wind &amp; magnetic field</div>
        <div class="wind">
          <div class="wcell"><div class="k">Speed</div><div class="v">${esc(num(wind.speed))} <small>km/s</small></div></div>
          <div class="wcell"><div class="k">Bt (field)</div><div class="v">${esc(num(wind.bt, 1))} <small>nT</small></div></div>
          <div class="wcell"><div class="k">Bz (south = active)</div><div class="v" style="color:${wind.bz != null && wind.bz < -5 ? "var(--storm)" : "inherit"}">${esc(num(wind.bz, 1))} <small>nT</small></div></div>
          <div class="wcell"><div class="k">Density</div><div class="v">${esc(num(wind.density, 1))} <small>p/cm³</small></div></div>
        </div>
        <div class="notice">A fast wind with a strongly negative Bz drives geomagnetic activity.</div>
      </div>

      <div class="panel" style="grid-column:1 / -1">
        <div class="p-label">NOAA storm scales · current</div>
        <div class="scales">
          ${scaleCell("R", "Radio blackout", scales.R)}
          ${scaleCell("S", "Solar radiation", scales.S)}
          ${scaleCell("G", "Geomagnetic", scales.G)}
        </div>
      </div>
    </div>`;
}

/* ---------- load ---------- */
let refreshTimer = null;
async function load() {
  const loc = getLocation();
  if (!loc) { renderFirstRun(); return; }
  locLabelEl.textContent = loc.label;
  const cached = Suite.store.get(CACHE, null);
  if (cached && cached.t != null) render(cached.v, cached.t);
  else skeleton();

  try {
    const [kpR, scalesR, speedR, magR] = await Promise.all([
      getSW("kp", "https://services.swpc.noaa.gov/products/noaa-planetary-k-index.json"),
      getSW("scales", "https://services.swpc.noaa.gov/products/noaa-scales.json"),
      getSW("windspeed", "https://services.swpc.noaa.gov/products/summary/solar-wind-speed.json").catch(() => null),
      getSW("windmag", "https://services.swpc.noaa.gov/products/summary/solar-wind-mag-field.json").catch(() => null)
    ]);
    const kpArr = kpR.v, scalesObj = scalesR.v;
    const speedArr = speedR ? speedR.v : null;
    const magArr = magR ? magR.v : null;

    // K-index: array of {time_tag, Kp, ...}
    const kpRows = (kpArr || []).filter(r => r && typeof r.Kp === "number");
    const latest = kpRows[kpRows.length - 1] || { Kp: 0, time_tag: "" };
    const history = kpRows.slice(-24).map(r => r.Kp);
    const kpWhen = latest.time_tag ? "3-hr period to " + new Date(latest.time_tag + "Z").toLocaleString([], { month:"short", day:"numeric", hour:"numeric" }) : "recent";

    // density from summary speed if present (summary speed only has proton_speed); pull density from mag? No.
    const speed = speedArr && speedArr[0] ? speedArr[0].proton_speed : null;
    const mag = magArr && magArr[0] ? magArr[0] : {};

    const model = {
      kp: latest.Kp,
      kpWhen,
      kpHistory: history.length ? history : [latest.Kp],
      scales: scalesObj && scalesObj["0"] ? scalesObj["0"] : {},
      wind: { speed, bt: mag.bt, bz: mag.bz_gsm, density: null }
    };

    const parts = [kpR, scalesR, speedR, magR].filter(Boolean);
    const anyStale = parts.some(r => r.stale);
    const stamp = Math.min.apply(null, parts.map(r => r.t));
    if (!anyStale) Suite.store.set(CACHE, { t: stamp, v: model }); // keep the v1 blob current
    render(model, stamp);
    if (anyStale) updatedEl.textContent = "offline · last data " + relTime(stamp);
  } catch(e) {
    const c = Suite.store.get(CACHE, null);
    if (c) {
      render(c.v, c.t);
      updatedEl.textContent = "offline · last data " + relTime(c.t);
    } else {
      mainEl.innerHTML =
        `<div class="panel"><div class="card-msg"><div class="big">Couldn't reach the space-weather service</div>
         ${esc(e.message || e)}.
         <div class="row" style="margin-top:1rem"><button class="btn" id="retry">Try again</button></div></div></div>`;
      const rb = $("#retry"); if (rb) rb.addEventListener("click", load);
    }
  }
}

/* ---------- first run ---------- */
function renderFirstRun(msg) {
  locLabelEl.textContent = "not set";
  mainEl.innerHTML =
    `<div class="panel"><div class="card-msg">
      <div class="big">Set your location</div>
      Your latitude decides whether the aurora could reach you. Space-weather numbers themselves are global.
      ${msg ? `<div class="notice" style="color:var(--errnote)">${esc(msg)}</div>` : ""}
      <div class="field"><label for="zip">US ZIP code</label>
        <input id="zip" inputmode="numeric" placeholder="e.g. 10001" maxlength="5"></div>
      <div class="row">
        <button class="btn" id="zipGo">Set location</button>
        <button class="btn ghost" id="geoGo">Use my location</button>
      </div>
      <div class="notice" id="locMsg"></div>
    </div></div>`;
  const zip = $("#zip"), locMsg = $("#locMsg");
  zip.focus();
  zip.addEventListener("keydown", e => { if (e.key === "Enter") $("#zipGo").click(); });
  $("#zipGo").addEventListener("click", async () => {
    const z = (zip.value || "").trim();
    if (!/^\d{5}$/.test(z)) { locMsg.textContent = "Enter a 5-digit ZIP code."; return; }
    locMsg.textContent = "Looking up…";
    try {
      const d = (await Suite.fetchJSON(`https://api.zippopotam.us/us/${z}`)).v;
      const place = d.places && d.places[0];
      if (!place) throw new Error("ZIP not found");
      saveLocation({ lat: parseFloat(place.latitude), lon: parseFloat(place.longitude),
        label: `${place["place name"]}, ${place["state abbreviation"]} ${z}` });
      load();
    } catch(e) { locMsg.textContent = "Couldn't find that ZIP (" + (e.message || e) + ")."; }
  });
  $("#geoGo").addEventListener("click", () => {
    if (!navigator.geolocation) { locMsg.textContent = "Geolocation isn't available here."; return; }
    locMsg.textContent = "Requesting location… (may need http/https)";
    navigator.geolocation.getCurrentPosition(
      pos => { saveLocation({ lat: +pos.coords.latitude.toFixed(4), lon: +pos.coords.longitude.toFixed(4),
        label: `My location (${pos.coords.latitude.toFixed(3)}, ${pos.coords.longitude.toFixed(3)})` }); load(); },
      err => { locMsg.textContent = "Couldn't get location: " + err.message; });
  });
}
$("#changeLoc").addEventListener("click", () => renderFirstRun());

/* ---------- boot ---------- */
function startTimer() { if (refreshTimer) clearInterval(refreshTimer); refreshTimer = setInterval(load, 10 * 60 * 1000); }
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
startTimer();
load();

/* First run: no location saved anywhere yet — ask the browser once and reload into
   the normal view. Inert when a location exists, when the user turned detection off
   in Settings, or when a previous request was refused (core: Suite.location). */
Suite.location.autoBoot();
</script>
</body>
