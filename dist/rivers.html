  autoDenied() { return store.get(AUTO_DENIED_KEY) === "denied"; },
  setAuto(on) {
    /* turning it back on is also how you take back a "Block" — otherwise a
       single misclick would be unrecoverable without the storage viewer */
    if (on) { store.remove(AUTO_DENIED_KEY); return store.remove(AUTO_KEY); }
    return store.set(AUTO_KEY, "off");
  },
  /* Keep an already-open location tool responsive when Settings, the hub, or
     another tool changes the shared location in a different tab/window. Reload
     is the safe default because tools consume location in several shapes and
     some snapshot it at parse time. The caller may supply a focused re-render
     callback when it can fully rebind its own state and in-flight work. */
  watch(callback) {
    const refresh = typeof callback === "function"
      ? callback : () => window.location.reload();
    const onStorage = e => {
      if (e.key === "suite.location") refresh(loc.get(), e);
    };
    window.addEventListener("storage", onStorage);
    return () => window.removeEventListener("storage", onStorage);
  },
  /* true when asking could actually get somewhere — used to stay silent rather
     than paint a "finding you…" state that can never resolve */
  autoPossible() {
    return !loc.get() && loc.autoEnabled() && !loc.autoDenied() &&
      typeof navigator !== "undefined" && !!navigator.geolocation;
  },
  auto() {
    const have = loc.get();
    if (have) return Promise.resolve(have);
    if (!loc.autoPossible()) return Promise.resolve(null);
    return new Promise(resolve => {
      let settled = false;
      const done = v => { if (!settled) { settled = true; resolve(v); } };
      try {
        navigator.geolocation.getCurrentPosition(
          pos => {
            const lat = +pos.coords.latitude.toFixed(4);
            const lon = +pos.coords.longitude.toFixed(4);
            try {
              loc.set({ lat, lon, label: "My location (" + lat + ", " + lon + ")" });
            } catch (e) { return done(null); }
            /* resolve only on a write that actually stuck: a failed write (storage
               full, denied, private mode) must not report success, or autoBoot
               would reload into the same empty page forever */
            done(loc.get());
          },
          err => {
            if (!err || err.code !== 1) return done(null);   // 1 = PERMISSION_DENIED
            /* Remember only a refusal someone actually made. Automation, headless
               runs and enterprise policy all report the same code 1 while the
               permission state is still "prompt" — persisting that would switch
               the feature off for good for a user who was never asked. When the
               Permissions API can't say (older Safari rejects for geolocation),
               treat it as a real refusal: re-prompting on every load is worse. */
            let q = null;
            try {
              q = navigator.permissions && navigator.permissions.query({ name: "geolocation" });
            } catch (e) { q = null; }
            if (!q || typeof q.then !== "function") {
              store.set(AUTO_DENIED_KEY, "denied");
              return done(null);
            }
            q.then(
              s => { if (!s || s.state !== "prompt") store.set(AUTO_DENIED_KEY, "denied"); },
              () => { store.set(AUTO_DENIED_KEY, "denied"); }
            ).then(() => done(null), () => done(null));
          },
          { timeout: GEO_TIMEOUT_MS, maximumAge: 600000 }
        );
      } catch (e) { done(null); }
    });
  },
  /* Drop-in for a tool's boot: does nothing at all unless this is a genuine cold
     start, then reloads once the location lands. Reload rather than re-render
     because tools read the location in a dozen different shapes — several cache
     it at parse time — and on a cold start there is nothing on screen to lose:
     the page is showing its empty "set your location" card. Same move those
     tools already make on the cross-tab storage event.

     But not every tool blocks on a location — geo, elevation, recalls and the
     station pickers are usable straight away — so anything the user has typed
     cancels the reload. The location is saved and shared either way; only the
     free re-render is given up, and the next visit opens on it. */
  autoBoot() {
    if (!loc.autoPossible()) return Promise.resolve(null);
    let typed = false;
    const mark = () => { typed = true; };
    const watch = typeof document !== "undefined" && document.addEventListener;
    if (watch) {
      document.addEventListener("input", mark, true);
      document.addEventListener("change", mark, true);
    }
    const unwatch = () => {
      if (!watch) return;
      document.removeEventListener("input", mark, true);
      document.removeEventListener("change", mark, true);
    };
    return loc.auto().then(l => {
      unwatch();
      if (l && !typed && typeof window !== "undefined") window.location.reload();
      return l;
    }, () => { unwatch(); return null; });
  }
});

const locations = {
  /* Migration is explicit: only v3 entry points (hub/settings) call init().
     Older tools that merely read suite.location do not gain a surprise key. */
  init() {
    let c = readLocations();
    if (c && (c.unsupported || c.invalid)) return c;
    if (c && c.items.length) {
      const item = activeItem(c);
      if (item) mirrorLocation(item);
      return c;
    }
    if (c) store.remove(LOCATIONS_KEY);
    const legacy = loc.get();
    if (!legacy) return { schema: LOCATIONS_SCHEMA, activeId: null, items: [] };
    const item = Object.assign({ id: "saved-location", revision: 1 }, legacy);
    item.label = legacy.label;
    c = { schema: LOCATIONS_SCHEMA, activeId: item.id, items: [item] };
    writeLocations(c);
    return c;
  },
  all() { return locations.init().items.map(x => Object.assign({}, x)); },
  active() {
    const c = locations.init();
    if (c.unsupported || c.invalid) {
      const legacy = loc.get();
      return legacy ? Object.assign({ id: null, storageIssue: c.unsupported ? "newer" : "invalid" }, legacy) : null;
    }
    const item = activeItem(c);
    return item ? Object.assign({}, item) : null;
  },
  add(l) {
    if (!validLocation(l)) throw new Error("Suite.locations.add needs valid {lat, lon}");
    const c = requireSupported(locations.init());
    const label = String(l.label || "").trim() || "Saved location";
    const item = Object.assign({ id: uniqueId(c, label), label, revision: 1 }, cleanLocation(l));
    item.label = label;
    c.items.push(item);
    const becomesActive = !c.activeId;
    if (becomesActive) c.activeId = item.id;
    const collectionSaved = writeLocations(c);
    const mirrored = collectionSaved && (!becomesActive || mirrorLocation(item));
    let purged = 0;
    if (becomesActive && mirrored) purged = resetLocationState();
    return { location: Object.assign({}, item), purged, saved: !!mirrored };
  },
  update(id, changes) {
    const c = requireSupported(locations.init());
    const item = c.items.find(x => x.id === id);
    if (!item) throw new Error("Unknown saved location: " + id);
    const candidate = {
      lat: changes && changes.lat !== undefined ? changes.lat : item.lat,
      lon: changes && changes.lon !== undefined ? changes.lon : item.lon,
      label: changes && changes.label !== undefined ? changes.label : item.label
    };
    if (!validLocation(candidate)) throw new Error("Suite.locations.update needs valid coordinates");
    const moved = item.lat !== +candidate.lat || item.lon !== +candidate.lon;
    item.lat = +candidate.lat; item.lon = +candidate.lon;
    item.label = String(candidate.label || "").trim() || item.label || "Saved location";
    if (moved) item.revision++;
    const collectionSaved = writeLocations(c);
    let mirrored = collectionSaved;
    let purged = 0;
    if (collectionSaved && c.activeId === id) {
      mirrored = mirrorLocation(item);
      if (moved && mirrored) purged = resetLocationState();
    }
    return { location: Object.assign({}, item), purged, saved: !!mirrored };
  },
  activate(id) {
    const c = requireSupported(locations.init());
    const item = c.items.find(x => x.id === id);
    if (!item) throw new Error("Unknown saved location: " + id);
    const changed = c.activeId !== id;
    c.activeId = id;
    const saved = writeLocations(c);
    const mirrored = saved && mirrorLocation(item);
    return { location: Object.assign({}, item),
      purged: changed && mirrored ? resetLocationState() : 0, saved: !!mirrored };
  },
  remove(id) {
    const c = requireSupported(locations.init());
    const i = c.items.findIndex(x => x.id === id);
    if (i < 0) return { removed: false, active: locations.active(), purged: 0 };
    const wasActive = c.activeId === id;
    c.items.splice(i, 1);
    if (wasActive) c.activeId = c.items[0] ? c.items[0].id : null;
    const saved = c.items.length ? writeLocations(c) : store.remove(LOCATIONS_KEY);
    const next = activeItem(c);
    const mirrored = !wasActive || (saved && mirrorLocation(next));
    return { removed: true, active: next ? Object.assign({}, next) : null,
      purged: wasActive && mirrored ? resetLocationState() : 0, saved: !!(saved && mirrored) };
  }
};

/* ---- API keys: the suite.key.<name> convention (API-AND-RELAY.md §3) ----
   Officially published demo/public keys only — never a personal key. */
const DEMO_KEYS = {
  nasa: "DEMO_KEY",              // api.nasa.gov demo tier: 30/hr, 50/day
  usda: "DEMO_KEY",              // USDA FoodData Central demo tier
  bart: "MW9S-E7SL-26DU-VV8V"    // BART's officially published public key
};
function key(name) {
  const v = store.get("suite.key." + name);
  if (typeof v === "string" && v.trim()) return { value: v.trim(), isDemo: false };
  if (DEMO_KEYS[name]) return { value: DEMO_KEYS[name], isDemo: true };
  return { value: null, isDemo: false };
}

/* ---- favorites & recently used: suite-wide quick access (v4) ----
   suite.hub.favorites is an array of tool ids; suite.hub.recents is
   [{id, t}] newest-first, bounded. The per-tool chrome star is injected next
   to the theme button by theme.init() — every built page already calls it, so
   no tool needed new markup. The hub renders its own card stars plus the
   Favorites and Recently used sections; it is excluded here (and Settings is
   excluded from recents) so "recently used" stays about actual tools. */
const FAV_KEY = "suite.hub.favorites";
const RECENTS_KEY = "suite.hub.recents";
const RECENTS_MAX = 10;

function toolId() {
  try {
    const file = decodeURIComponent((location.pathname.split("/").pop() || ""));
    const m = file.match(/^([a-z][a-z0-9-]*)\.html$/);
    if (m) return m[1];
    /* a hosted scope root ("…/local-suite-4/") serves the hub */
    return /\/$/.test(location.pathname) ? "index" : null;
  } catch (e) { return null; }
}

const favorites = {
  all() {
    const v = store.get(FAV_KEY);
    return Array.isArray(v) ? v.filter(x => typeof x === "string" && x) : [];
  },
  has(id) { return favorites.all().includes(id); },
  /* returns the new state; a write that does not stick reports the old one */
  toggle(id) {
    if (typeof id !== "string" || !id) return false;
    const cur = favorites.all();
    const next = cur.includes(id) ? cur.filter(x => x !== id) : cur.concat(id);
    return store.set(FAV_KEY, next) ? next.includes(id) : cur.includes(id);
  }
};

const recents = {
  all() {
    const v = store.get(RECENTS_KEY);
    if (!Array.isArray(v)) return [];
    return v.filter(x => x && typeof x === "object" &&
      typeof x.id === "string" && x.id && isFinite(x.t)).slice(0, RECENTS_MAX);
  },
  record(id) {
    if (typeof id !== "string" || !id || id === "index" || id === "settings") return false;
    const next = [{ id, t: Date.now() }]
      .concat(recents.all().filter(x => x.id !== id)).slice(0, RECENTS_MAX);
    return store.set(RECENTS_KEY, next);
  },
  clear() { return store.remove(RECENTS_KEY); }
};

function paintFavButtons() {
  document.querySelectorAll(".fav-btn[data-tool]").forEach(btn => {
    const on = favorites.has(btn.dataset.tool);
    btn.setAttribute("aria-pressed", String(on));
    btn.classList.toggle("on", on);
    btn.textContent = on ? "★" : "☆";
  });
}

/* Runs once from theme.init() on every page except the hub: notes the visit in
   recents and adds the chrome star beside the theme button. */
function initToolChrome() {
  const id = toolId();
  if (!id || id === "index") return;
  recents.record(id);
  const anchor = document.querySelector("#themeBtn, .theme-btn");
  if (!anchor || document.querySelector(".fav-btn")) return;
  const btn = document.createElement("button");
  btn.type = "button";
  btn.className = "fav-btn";
  btn.dataset.tool = id;
  btn.title = "Favorite this tool";
  btn.setAttribute("aria-label", "Favorite this tool — favorites appear first on the suite hub");
  btn.addEventListener("click", () => { favorites.toggle(id); paintFavButtons(); });
  anchor.insertAdjacentElement("afterend", btn);
  paintFavButtons();
  window.addEventListener("storage", e => { if (e.key === FAV_KEY) paintFavButtons(); });
}

/* ---- optional power-user relay (API-AND-RELAY.md §6) ----
   Unset for everyone by default: tools use their link-out/embedded paths. */
function relay(url) {
  const base = store.get("suite.relay.url");
  if (typeof base !== "string" || !base.trim()) return null;
  const b = base.trim().replace(/\/$/, "");
  return b + (b.includes("?") ? "&" : "?") + "url=" + encodeURIComponent(url);
}

window.Suite = { theme, fetchJSON, store, esc, liveRegion, location: loc, locations,
  favorites, recents, key, relay };

/* ---- PWA registration (PWA.md §1) — inert from file://, forever ----
   The .catch keeps a failed registration from ever costing console noise on a
   page that works perfectly well without the service worker. */
if (location.protocol.startsWith("http") && "serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
})();
</script>
<script>
"use strict";

Suite.theme.init();
Suite.location.watch();

/* ---------- shared suite helpers ---------- */
const esc=Suite.esc;
function getLoc(){ return Suite.location.get(); }
function setLoc(l){ Suite.location.set(l); }

function haversineKm(lat1,lon1,lat2,lon2){
  const R=6371,r=Math.PI/180;
  const dLa=(lat2-lat1)*r, dLo=(lon2-lon1)*r;
  const s=Math.sin(dLa/2)**2+Math.cos(lat1*r)*Math.cos(lat2*r)*Math.sin(dLo/2)**2;
  return 2*R*Math.asin(Math.sqrt(s));
}
function titleCase(s){ return String(s||"").toLowerCase().replace(/\b([a-z])/g,(m,c)=>c.toUpperCase()).replace(/\bNr\b/g,"near").replace(/\bBl\b/g,"below").replace(/\bAb\b/g,"above").replace(/\bR\b/g,"River").replace(/\bC\b/g,"Creek"); }

/* ---------- API ---------- */
const BASE="https://api.waterdata.usgs.gov/ogcapi/v0/collections";
/* v1 appended "&application=local-suite" per catalog etiquette, but the OGC API now
   rejects unknown query params as property filters (HTTP 400 InvalidQuery, verified
   2026-07-15) — v1's live fetch is broken by this today. The param is dropped; the
   response shape is unchanged. Browser JS cannot set User-Agent, so there is no
   remaining self-identification channel for this API. */
const TTL=15*60*1000; // manifest cacheTtlMin: 15 — matches the USGS ~15-min gauge transmission cadence and v1's refresh interval

/* ---------- cache: the v1 envelope at the v1 key (suite.cache.rivers.near_<lat>_<lon>).
   v1 cached the GROUPED gauge list (computed from two requests), not raw responses, so
   the manual envelope is kept for byte-identical key parity; Suite.fetchJSON is the
   transport underneath. ---------- */
function cacheGet(key){ const e=Suite.store.get("suite.cache.rivers."+key); return (e&&typeof e==="object"&&"t" in e&&"v" in e)?e:null; }
function cacheSet(key,v){ Suite.store.set("suite.cache.rivers."+key,{t:Date.now(),v}); }

/* ---------- favorites ---------- */
function favs(){ const a=Suite.store.get("suite.rivers.favs", []); return Array.isArray(a)?a:[]; }
function saveFavs(a){ Suite.store.set("suite.rivers.favs", a); }
function isFav(id){ return favs().some(f=>f.id===id); }
function toggleFav(g){
  let a=favs();
  if(a.some(f=>f.id===g.id)) a=a.filter(f=>f.id!==g.id);
  else a.push({id:g.id,name:g.name,lat:g.lat,lon:g.lon});
  saveFavs(a);
}

const appEl=document.getElementById("app");
let refreshTimer=null;

/* ---------- first-run location ---------- */
function renderSetup(){
  clearInterval(refreshTimer);
  appEl.innerHTML=`
    <div class="setup">
      <h2>Set your location</h2>
      <p>The board finds stream gauges near you. Enter a US ZIP, or use your device location.
         This is saved for the whole suite.</p>
      <div class="row">
        <input type="text" id="zip" inputmode="numeric" placeholder="US ZIP e.g. 59718" maxlength="5" aria-label="US ZIP code">
        <button class="btn primary" id="zipBtn">Set</button>
      </div>
      <div class="row"><button class="btn ghost" id="geoBtn" style="flex:1">Use my location</button></div>
      <div class="err-inline" id="setupErr"></div>
    </div>`;
  const zip=document.getElementById("zip");
  const err=Suite.liveRegion(document.getElementById("setupErr"));
  document.getElementById("zipBtn").addEventListener("click", async()=>{
    const z=zip.value.trim(); err.textContent="";
    if(!/^\d{5}$/.test(z)){ err.textContent="Enter a 5-digit ZIP."; return; }
    try{ const d=(await Suite.fetchJSON(`https://api.zippopotam.us/us/${z}`)).v; const p=d.places[0];
      setLoc({lat:parseFloat(p.latitude),lon:parseFloat(p.longitude),label:`${p["place name"]}, ${p["state abbreviation"]}`}); boot();
    }catch(e){ err.textContent="Couldn't find that ZIP. Try another."; }
  });
  zip.addEventListener("keydown",e=>{ if(e.key==="Enter") document.getElementById("zipBtn").click(); });
  document.getElementById("geoBtn").addEventListener("click", ()=>{
    if(!navigator.geolocation){ err.textContent="Geolocation isn't available here."; return; }
    err.textContent="Locating…";
    navigator.geolocation.getCurrentPosition(
      pos=>{ setLoc({lat:+pos.coords.latitude.toFixed(4),lon:+pos.coords.longitude.toFixed(4),label:"My location"}); boot(); },
      e=>{ err.textContent="Location denied. Try a ZIP instead (may need http://)."; });
  });
}

/* ---------- shell ---------- */
function renderShell(){
  const loc=getLoc();
  appEl.innerHTML=`
    <div class="locbar"><span>Near <b>${esc(loc.label)}</b></span><button class="linkbtn" id="changeLoc">change</button></div>
    <div id="stamp" class="stamp"></div>
    <div id="favSec"></div>
    <div id="nearSec"></div>
    <div class="note">Readings are provisional and unreviewed. This new USGS API serves live gauge height and
      discharge; formal flood-stage categories (action/minor/major) live in NWS AHPS, not here — treat rising
      gauge height as your flood cue and confirm with local warnings.</div>`;
  document.getElementById("changeLoc").addEventListener("click", renderSetup);
  Suite.liveRegion(document.getElementById("stamp"));
}

/* ---------- build a gauge object from grouped latest-continuous features ---------- */
function param(props){
  // returns {value, unit} formatting
  return {v:props.value, unit:props.unit_of_measure, time:props.time};
}

async function fetchNear(loc){
  // bbox ~ +/-0.55deg. lon width widened a touch by latitude handled loosely.
  const dLat=0.55, dLon=0.55/Math.max(0.3,Math.cos(loc.lat*Math.PI/180));
  const bbox=[loc.lon-dLon, loc.lat-dLat, loc.lon+dLon, loc.lat+dLat].map(n=>n.toFixed(4)).join(",");
  const url=`${BASE}/latest-continuous/items?bbox=${bbox}&parameter_code=00060,00065&limit=400&f=json`;
  const nameUrl=`${BASE}/monitoring-locations/items?bbox=${bbox}&limit=400&f=json`;
  const [latest,names]=await Promise.allSettled([Suite.fetchJSON(url), Suite.fetchJSON(nameUrl)]);
  if(latest.status!=="fulfilled") throw (latest.reason||new Error("fetch failed"));
  const nameMap={};
  if(names.status==="fulfilled"){
    for(const f of (names.value.v.features||[])){ const p=f.properties; if(p&&p.id) nameMap[p.id]=p.monitoring_location_name; }
  }
  return groupGauges(latest.value.v.features||[], nameMap, loc);
}

function groupGauges(features, nameMap, loc){
  const by={};
  for(const f of features){
    const p=f.properties||{}; const id=p.monitoring_location_id; if(!id) continue;
    const g=f.geometry&&f.geometry.coordinates||[];
    if(!by[id]) by[id]={id, name:titleCase(nameMap[id]||id.replace(/^USGS-/,"Gauge ")), lon:g[0], lat:g[1], q:null, h:null};
    if(p.parameter_code==="00060") by[id].q=param(p);
    else if(p.parameter_code==="00065") by[id].h=param(p);
  }
  const list=Object.values(by);
  for(const g of list){ g.dist=(loc&&isFinite(g.lat)&&isFinite(g.lon))?haversineKm(loc.lat,loc.lon,g.lat,g.lon):null; }
  // keep gauges that reported at least one value recently-ish
  list.sort((a,b)=>(a.dist??1e9)-(b.dist??1e9));
  return list;
}

async function fetchFavorites(){
  const list=favs();
  if(!list.length) return [];
  const results=await Promise.allSettled(list.map(async f=>{
    const url=`${BASE}/latest-continuous/items?monitoring_location_id=${encodeURIComponent(f.id)}&parameter_code=00060,00065&limit=10&f=json`;
    // v1 left favorites uncached; the per-favorite TTL cache is the policy-mandated
    // good-citizen change (API-AND-RELAY.md §2) — stale cache serves when offline,
    // and the card's own ">3 h old" amber marker keeps the age visible.
    const d=await Suite.fetchJSON(url,{cacheKey:"rivers.fav_"+f.id, ttl:TTL});
    const loc=getLoc();
    const g=groupGauges(d.v.features||[], {[f.id]:f.name}, loc)[0] || {id:f.id,name:titleCase(f.name),lat:f.lat,lon:f.lon,q:null,h:null,dist:loc&&isFinite(f.lat)?haversineKm(loc.lat,loc.lon,f.lat,f.lon):null};
    return g;
  }));
  return results.map((r,i)=> r.status==="fulfilled"?r.value:{id:list[i].id,name:titleCase(list[i].name),q:null,h:null,dist:null,offline:true});
}

/* ---------- render gauge card ---------- */
function isStale(iso){ if(!iso) return false; return (Date.now()-new Date(iso).getTime())>3*3600*1000; }
function fmtVal(x){ const n=parseFloat(x); if(!isFinite(n)) return x; return n>=1000?Math.round(n).toLocaleString():(n>=100?Math.round(n):n.toFixed(2).replace(/\.00$/,"")); }
function readTime(g){
  const t=(g.q&&g.q.time)||(g.h&&g.h.time);
  if(!t) return "";
  const d=new Date(t);
  return `Read ${d.toLocaleString([], {month:"short",day:"numeric",hour:"numeric",minute:"2-digit"})}`;
}
function gaugeCard(g){
  const num=g.id.replace(/^USGS-/,"");
  const url=`https://waterdata.usgs.gov/monitoring-location/${num}/`;
  const stale=isStale((g.q&&g.q.time)||(g.h&&g.h.time));
  const q=g.q, h=g.h;
  const distTxt=g.dist!=null?`${g.dist.toFixed(g.dist<10?1:0)} km away`:"";
  const on=isFav(g.id);
  const disch = q&&q.v!=null
    ? `<div class="reading"><b>${esc(fmtVal(q.v))} <small>ft³/s</small></b><span>discharge</span></div>`
    : `<div class="reading none"><b>—</b><span>discharge</span></div>`;
  const height = h&&h.v!=null
    ? `<div class="reading"><b>${esc(fmtVal(h.v))} <small>ft</small></b><span>gauge height</span></div>`
    : `<div class="reading none"><b>—</b><span>gauge height</span></div>`;
  const timeTxt = g.offline?"favorite · couldn't refresh":readTime(g);
  return `<div class="gauge">
    <div class="g-top">
      <h3><a href="${esc(url)}" target="_blank" rel="noopener">${esc(g.name)}</a></h3>
      <button class="starbtn${on?" on":""}" data-id="${esc(g.id)}" title="${on?"Remove favorite":"Add favorite"}" aria-label="Toggle favorite" aria-pressed="${on?"true":"false"}">${on?"★":"☆"}</button>
    </div>
    <div class="g-sub">USGS ${esc(num)}${distTxt?" · "+esc(distTxt):""}</div>
    <div class="readings">${disch}${height}</div>
    <div class="g-time${stale?" stale":""}">${esc(timeTxt)}${stale&&!g.offline?" · stale":""}</div>
  </div>`;
}

function wireStars(container, refresh){
  container.querySelectorAll(".starbtn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const id=btn.dataset.id;
      // find gauge data from current render caches
      const g=(lastNear.concat(lastFav)).find(x=>x.id===id) || {id,name:id,lat:null,lon:null};
      toggleFav(g);
      renderAll();
    });
  });
}

/* ---------- render orchestration ---------- */
let lastNear=[], lastFav=[], lastStamp=null, lastErr=null;

function renderStamp(){
  const el=document.getElementById("stamp"); if(!el) return;
  let s=lastStamp?`Data from ${new Date(lastStamp).toLocaleTimeString([], {hour:"numeric",minute:"2-digit"})}`:"";
  if(lastErr){ el.className="stamp err"; el.textContent=(s?s+" · ":"")+"connection issue: "+lastErr; }
  else { el.className="stamp"; el.textContent=s; }
}

function renderAll(){
  const favSec=document.getElementById("favSec"), nearSec=document.getElementById("nearSec");
  if(!favSec) return;
  renderStamp();
  // favorites
  const favList=favs();
  if(favList.length){
    const cards=lastFav.length?lastFav.map(gaugeCard).join(""):favList.map(f=>gaugeCard({id:f.id,name:titleCase(f.name),q:null,h:null,dist:null,offline:true})).join("");
    favSec.innerHTML=`<h2 class="sec">★ Favorites <span class="n">${favList.length}</span></h2><div class="grid" id="favGrid">${cards}</div>`;
  } else { favSec.innerHTML=""; }
  // nearby
  if(lastNear===null){
    nearSec.innerHTML=`<h2 class="sec">Nearby gauges</h2><div class="grid"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>`;
  } else if(!lastNear.length){
    nearSec.innerHTML=`<h2 class="sec">Nearby gauges</h2><div class="msg"><div class="big">No active gauges nearby</div>
      No USGS stream gauges reported discharge or gauge height within about 60&nbsp;km. Try a location closer to a river.</div>`;
  } else {
    const cards=lastNear.slice(0,60).map(gaugeCard).join("");
    nearSec.innerHTML=`<h2 class="sec">Nearby gauges <span class="n">${lastNear.length} found</span></h2><div class="grid">${cards}</div>`;
  }
  wireStars(document, renderAll);
}

async function load(){
  const loc=getLoc(); if(!loc) return;
  lastNear=null; renderAll();
  // nearby (cached, v1 key; grouped result)
  const ck="near_"+loc.lat.toFixed(2)+"_"+loc.lon.toFixed(2);
  const cached=cacheGet(ck);
  if(cached){ lastNear=cached.v; lastStamp=cached.t; renderAll(); }
  if(cached && Date.now()-cached.t<TTL){
    // policy-mandated TTL (API-AND-RELAY.md §2): a cache fresher than 15 min is
    // served as-is instead of refetching (v1 refetched on every open)
    lastErr=null;
  } else {
    try{
      lastNear=await fetchNear(loc); lastStamp=Date.now(); lastErr=null;
      cacheSet(ck,lastNear);
    }catch(e){ lastErr=e.message||String(e); if(lastNear===null) lastNear=cached?cached.v:[]; }
  }
  renderAll();
  // favorites
  try{ lastFav=await fetchFavorites(); }catch(e){ /* keep prior */ }
  renderAll();
}

function boot(){
  if(!getLoc()){ renderSetup(); return; }
  renderShell();
  lastFav=[]; lastNear=null;
  load();
  clearInterval(refreshTimer);
  refreshTimer=setInterval(load, 15*60*1000);
}
document.addEventListener("visibilitychange",()=>{ if(!document.hidden && getLoc()) load(); });
boot();

/* First run: no location saved anywhere yet — ask the browser once and reload into
   the normal view. Inert when a location exists, when the user turned detection off
   in Settings, or when a previous request was refused (core: Suite.location). */
Suite.location.autoBoot();
</script>
</body>
</html>
