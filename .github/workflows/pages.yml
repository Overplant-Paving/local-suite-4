# Deploys dist/ to GitHub Pages on every push to main (ROADMAP Phase 3 step 4).
# dist/ is committed and built locally by build.py — this workflow only publishes it.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json
      - run: python3 build.py --check
      - run: npm ci --prefix tests
      - run: npx --prefix tests playwright install --with-deps chromium
      - run: node tests/multiple-locations.mjs
      - run: node tests/location-cross-tab.mjs
      - run: node tests/favorites-recents.mjs
      - run: node tests/flight-built.mjs
      - run: node tests/parks-built.mjs
      - run: node tests/arcade-built.mjs
      - run: node tests/flood-built.mjs
      - run: node tests/optical-built.mjs
      - run: node tests/audio-built.mjs
      - run: node tests/smoke.mjs
      - run: node tests/pwa-verify.mjs coexist
  deploy:
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
